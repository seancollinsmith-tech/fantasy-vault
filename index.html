<!-- Home-screen install (PWA) — installability matters most for a Daily
     Challenge product specifically: a home-screen icon gets tapped out of
     habit, a bookmarked Safari tab gets forgotten. manifest.json is a
     separate file that needs to be deployed alongside this HTML file (it
     can't be embedded inline in a way that's reliably supported), see the
     content to create noted where PRODUCTION_URL is defined below. The
     apple- prefixed tags below are the more load-bearing half on iOS
     specifically — Safari's "Add to Home Screen" leans on these more than
     on manifest.json, which matters here since every screenshot from this
     product so far has been iOS Safari. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasy Vault">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --vault-black:#0a0e14;
    --vault-green:#121a2b;
    --vault-green-2:#182338;
    --brass:#3fb8a8;
    --brass-bright:#6fe0cf;
    --cream:#e8f1f8;
    --cream-dim:#8fa3b8;
    --ember:#c2513f;
    --win:#3f8f5f;
    --line:rgba(63,184,168,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(63,184,168,0.10), transparent 60%),
      var(--vault-black);
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
    overflow-x:hidden;
  }
  .wrap{max-width:1100px;margin:0 auto;}

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
    padding-bottom:18px;
    margin-bottom:22px;
  }
  .brand-eyebrow{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    letter-spacing:0.35em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 6px;
  }
  .sport-badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:10px;
    padding:5px 12px;
    border-radius:999px;
    font-family:'Oswald',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.04em;
    background:rgba(111,224,207,0.10);
    border:1px solid rgba(111,224,207,0.35);
    color:var(--brass-bright);
  }
  .sport-badge.is-nhl{
    background:rgba(113,175,229,0.10);
    border-color:rgba(113,175,229,0.4);
    color:#8ec4ec;
  }
  .sport-badge-mode{ opacity:0.65; font-weight:500; }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-style:italic;
    font-size:clamp(28px,4vw,44px);
    margin:0;
    color:var(--cream);
    letter-spacing:0.01em;
  }
  h1 span{color:var(--brass-bright);font-style:normal;}
  h1#homeLogo{transition:opacity .15s;}
  h1#homeLogo:hover{opacity:0.75;}
  .header-actions{display:flex;gap:10px;flex-wrap:wrap;}

  button{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
    border-radius:3px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--cream-dim);
    padding:10px 16px;
    transition:border-color .15s, color .15s, background .15s;
  }
  button:hover{border-color:var(--brass);color:var(--cream);}
  button:focus-visible{outline:2px solid var(--brass-bright);outline-offset:2px;}
  button.primary{
    background:var(--brass);
    border-color:var(--brass);
    color:#1a1005;
  }
  button.primary:hover{background:var(--brass-bright);border-color:var(--brass-bright);}
  button.ghost-ember{border-color:rgba(194,81,63,0.4);color:#b47fe0;}
  button.ghost-ember:hover{border-color:var(--ember);color:#ffb389;}
  button:disabled{opacity:0.35;cursor:not-allowed;}
  .deal-choice{display:flex;gap:14px;margin-top:16px;}
  .deal-choice button{
    font-size:16px;
    padding:16px 32px;
    letter-spacing:0.08em;
  }
  .deal-choice button.primary{
    box-shadow:0 4px 20px rgba(111,224,207,0.25);
  }
  .deal-choice button.primary:hover{box-shadow:0 6px 26px rgba(111,224,207,0.35);}
  @media (max-width:480px){
    .deal-choice{flex-direction:column;}
    .deal-choice button{width:100%;padding:16px 24px;}
  }
  button:disabled:hover{border-color:var(--line);color:var(--cream-dim);background:transparent;}

  /* ---------- Status strip ---------- */
  .status-strip{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    background:var(--vault-green);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 20px;
    margin-bottom:22px;
  }
  .status-block{display:flex;flex-direction:column;gap:2px;}
  .status-label{font-size:10px;letter-spacing:0.2em;text-transform:uppercase;color:var(--cream-dim);}
  .status-value{font-size:18px;font-weight:600;color:var(--brass-bright);font-variant-numeric:tabular-nums;}
  .status-action{padding-right:18px;border-right:1px solid var(--line);margin-right:4px;}
  .status-action-label{
    font-family:'Oswald',sans-serif;
    font-size:19px;
    font-weight:700;
    letter-spacing:0.04em;
    color:var(--brass-bright);
  }

  .vault-progress{
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
    background:var(--vault-green-2);
    border:1px solid var(--line);
    border-radius:4px;
    padding:14px 20px;
    margin-bottom:22px;
  }
  .vault-slot{display:flex;align-items:center;gap:8px;min-width:0;}
  .vault-dot{
    width:11px; height:11px; border-radius:50%;
    border:1.5px solid var(--line);
    background:transparent;
    flex-shrink:0;
    transition:all .25s;
  }
  .vault-slot.current .vault-dot{
    border-color:var(--brass-bright);
    box-shadow:0 0 8px rgba(111,224,207,0.5);
    animation:vaultPulse 1.6s ease-in-out infinite;
  }
  @keyframes vaultPulse{0%,100%{opacity:1;}50%{opacity:0.4;}}
  .vault-slot-label{font-size:11.5px;color:var(--cream-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vault-slot.filled .vault-slot-label{color:var(--cream);}
  .vault-slot.filled .vault-slot-label strong{color:var(--cream);font-weight:600;margin-right:4px;}
  .vault-slot-pos{display:inline-block;font-size:10px;font-weight:700;letter-spacing:0.03em;color:var(--brass-bright);border:1px solid var(--brass-bright);border-radius:3px;padding:0 4px;margin-right:5px;vertical-align:middle;}
  .vault-slot.current .vault-slot-label{color:var(--brass-bright);font-weight:600;}
  @media (max-width:480px){
    .vault-progress{flex-direction:column;align-items:stretch;gap:10px;}
    .vault-slot-label{white-space:normal;overflow:visible;text-overflow:clip;}
  }

  /* ---------- Board grid ---------- */
  .game-area{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:nowrap;
    margin-bottom:24px;
  }
  .board{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(88px,1fr));
    gap:10px;
    flex:1 1 auto;
    min-width:0;
  }

  /* ---------- Value ladder ---------- */
  .ladder{
    flex:0 0 260px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .ladder-title{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0;
  }
  .ladder-cols{
    display:flex;
    gap:8px;
  }
  .ladder-col{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .ladder-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    background:linear-gradient(90deg,var(--vault-green-2),var(--vault-green));
    border:1px solid var(--line);
    border-radius:3px;
    padding:5px 9px;
    font-size:12.5px;
    font-weight:500;
    font-variant-numeric:tabular-nums;
    color:var(--cream);
    transition:opacity .2s, background .2s, border-color .2s, color .2s;
  }
  .ladder-row.struck{
    opacity:0.28;
    background:var(--vault-black);
    border-color:rgba(63,184,168,0.08);
  }
  .ladder-row.struck .lv-value{text-decoration:line-through;text-decoration-color:var(--ember);}
  .ladder-row.held-value{
    border-color:var(--brass-bright);
    box-shadow:0 0 0 1px var(--brass-bright);
  }
  @media (max-width:640px){
    .game-area{flex-direction:column;flex-wrap:nowrap;}
    .board{width:100%;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}
    .ladder{flex:0 0 auto;width:100%;}
    .status-strip{gap:14px 22px;padding:14px 16px;}
    .case-num{font-size:9px;}
    .case-lock{font-size:16px;}
    .case-btn.opened .team-badge{display:none;}
    .case-btn.opened .case-player{font-size:10px;}
    .case-btn.opened .case-value{font-size:10.5px;}
    body{padding-top:40px;}
  }
  .case-btn{
    aspect-ratio:1/1.15;
    background:linear-gradient(160deg,var(--vault-green-2),var(--vault-green));
    border:1px solid var(--line);
    border-radius:6px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:4px;
    padding:6px 4px;
    position:relative;
    overflow:hidden;
    text-align:center;
  }
  .case-btn::before{
    content:'';
    position:absolute;
    inset:6px;
    border:1px solid rgba(63,184,168,0.15);
    border-radius:4px;
    pointer-events:none;
  }
  .case-num{
    font-size:11px;
    letter-spacing:0.1em;
    color:var(--brass);
    text-transform:uppercase;
  }
  .case-lock{font-size:20px;color:var(--brass-bright);}
  .case-btn{
    box-shadow:0 1px 0 rgba(255,255,255,0.04) inset, 0 6px 14px rgba(0,0,0,0.35);
    transition:transform .15s, border-color .15s, box-shadow .15s;
  }
  .case-btn:hover:not(:disabled){
    border-color:var(--brass-bright);
    transform:translateY(-3px);
    box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 10px 20px rgba(0,0,0,0.45);
  }
  .case-btn:active:not(:disabled){transform:translateY(-1px);}
  .case-btn:disabled{cursor:default;}
  .case-btn.held{
    border-color:var(--brass-bright);
    box-shadow:0 1px 0 rgba(255,255,255,0.06) inset, 0 0 0 1px var(--brass-bright), 0 0 18px rgba(111,224,207,0.25);
  }
  .case-btn.held::after{
    content:'YOUR CASE';
    position:absolute;
    bottom:6px;
    font-size:8px;
    letter-spacing:0.12em;
    color:var(--brass-bright);
    font-weight:600;
  }
  .case-btn.opened{
    background:linear-gradient(160deg,var(--vault-green-2),var(--vault-black));
    box-shadow:0 1px 0 rgba(255,255,255,0.03) inset, 0 4px 10px rgba(0,0,0,0.3);
  }
  .case-btn.opened .case-player{
    font-family:'Fraunces',serif;
    font-size:11px;
    font-weight:600;
    color:var(--cream);
    line-height:1.15;
  }
  .case-btn.opened .case-value{
    font-family:'Oswald',sans-serif;
    font-size:11.5px;
    font-weight:600;
  }

  /* ---------- Panels (offer / final / setup) ---------- */
  .panel{
    background:var(--vault-green);
    border:1px solid var(--line);
    border-radius:6px;
    padding:26px;
    margin-bottom:24px;
  }
  .panel h2{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-weight:600;
    font-size:22px;
    margin:0 0 14px;
    color:var(--cream);
  }
  .how-to-play{
    font-size:16px;
    color:var(--brass-bright);
    margin:0 0 22px;
    padding-bottom:18px;
    border-bottom:1px solid var(--line);
    line-height:1.5;
  }
  .offer-amount{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:clamp(36px,6vw,56px);
    color:var(--brass-bright);
    letter-spacing:0.01em;
    margin:6px 0 18px;
    font-variant-numeric:tabular-nums;
  }
  .panel p{color:var(--cream-dim);line-height:1.6;font-size:15px;margin:0 0 18px;max-width:60ch;}
  .panel-actions{display:flex;gap:12px;flex-wrap:wrap;}

  /* ---------- Setup / edit table ---------- */
  .edit-table{width:100%;border-collapse:collapse;font-size:13px;}
  .edit-table th{
    text-align:left;
    font-size:10px;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--brass);
    border-bottom:1px solid var(--line);
    padding:8px 8px;
  }
  .edit-table td{border-bottom:1px solid rgba(63,184,168,0.1);padding:6px 8px;}
  .edit-table input{
    width:100%;
    background:var(--vault-black);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    padding:6px 8px;
  }
  .edit-table input:focus-visible{outline:2px solid var(--brass-bright);outline-offset:1px;}
  .edit-table input.val{text-align:right;font-variant-numeric:tabular-nums;}
  .table-scroll{max-height:420px;overflow-y:auto;margin-bottom:18px;border:1px solid var(--line);border-radius:4px;}

  /* ---------- Presets ---------- */
  .preset-block{
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px 18px;
    margin-bottom:20px;
    background:rgba(63,184,168,0.04);
  }
  .preset-block h3{
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 12px;
  }
  .preset-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .preset-row:last-child{margin-bottom:0;}
  select, .preset-row input[type="text"], .preset-row input[type="email"], .preset-row input[type="password"]{
    background:var(--vault-black);
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--cream);
    font-family:'Oswald',sans-serif;
    font-size:13px;
    padding:9px 12px;
    min-width:180px;
  }
  select:focus-visible, .preset-row input:focus-visible{outline:2px solid var(--brass-bright);outline-offset:1px;}
  .preset-hint{font-size:11.5px;color:var(--cream-dim);margin:0;}
  .preset-status{font-size:11.5px;color:var(--brass-bright);margin:8px 0 0;min-height:14px;}

  /* ---------- Landing hero: Today's Vault ---------- */
  .hero-panel{
    text-align:center;
    background:linear-gradient(160deg, rgba(63,184,168,0.10), rgba(63,184,168,0.02));
    padding:44px 24px 36px;
  }
  .hero-eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  .hero-headline{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:clamp(32px,5vw,48px);
    color:var(--cream);
    margin:0 0 10px;
  }
  .hero-tagline{
    font-size:15px;
    color:var(--cream-dim);
    margin:0 0 26px;
  }
  .hero-cta{
    font-size:16px;
    padding:16px 36px;
    letter-spacing:0.08em;
    box-shadow:0 4px 20px rgba(111,224,207,0.25);
  }
  .hero-cta:hover{box-shadow:0 6px 26px rgba(111,224,207,0.35);}
  .hero-cta:disabled{box-shadow:none;opacity:0.5;}
  .hero-note{
    font-size:12px;
    color:var(--cream-dim);
    margin:10px 0 0;
  }
  .hero-streak{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    margin-top:22px;
  }
  .hero-streak-value{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:28px;
    color:var(--brass-bright);
  }
  .hero-streak-label{
    font-size:11px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    color:var(--cream-dim);
  }

  .secondary-options{margin-top:20px;}
  .secondary-options summary{
    cursor:pointer;
    text-align:center;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--cream-dim);
    padding:10px 0;
    list-style:none;
  }
  .secondary-options summary::-webkit-details-marker{display:none;}
  .secondary-options summary::after{content:' ▾';}
  .secondary-options[open] summary::after{content:' ▴';}
  .secondary-options summary:hover{color:var(--brass-bright);}

  /* ---------- Banker ringing ---------- */
  .ring-stage{display:flex;flex-direction:column;align-items:flex-start;gap:18px;padding:10px 0 4px;}

  /* ---------- Offer history sidebar (ringing + offer panels) ---------- */
  .offer-panel-body{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start;}
  .offer-history-side{
    flex:0 0 200px;
    border-left:1px solid var(--line);
    padding-left:22px;
  }
  .offer-history-side h4{
    font-size:10px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--brass);
    margin:0 0 10px;
  }
  .offer-history-side ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
    max-height:180px;
    overflow-y:auto;
  }
  .offer-history-side li{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13px;
    color:var(--cream-dim);
  }
  .offer-history-side li strong{color:var(--cream);font-weight:600;}
  .offer-history-side .round-tag{font-size:10.5px;color:var(--brass);letter-spacing:0.08em;text-transform:uppercase;white-space:nowrap;}
  @media (max-width:560px){
    .offer-history-side{flex:1 1 100%;border-left:none;border-top:1px solid var(--line);padding-left:0;padding-top:14px;}
  }
  .ring-badge{
    position:relative;
    width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    border-radius:50%;
    background:var(--vault-black);
    border:1px solid var(--brass);
  }
  .ring-badge::before, .ring-badge::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1px solid var(--brass);
    animation:ringPulse 1.6s ease-out infinite;
  }
  .ring-badge::after{animation-delay:.5s;}
  .ring-glyph{font-size:26px;line-height:1;}
  @keyframes ringPulse{
    0%{transform:scale(1);opacity:0.9;}
    100%{transform:scale(2.1);opacity:0;}
  }
  .ring-text{font-size:13px;letter-spacing:0.15em;text-transform:uppercase;color:var(--cream-dim);}
  .ring-text .dots span{animation:ringDots 1.4s infinite;opacity:0;}
  .ring-text .dots span:nth-child(2){animation-delay:.2s;}
  .ring-text .dots span:nth-child(3){animation-delay:.4s;}
  .last-case-note{
    font-size:14px;
    color:var(--cream);
    background:rgba(63,184,168,0.08);
    border:1px solid var(--line);
    border-radius:4px;
    padding:8px 14px;
  }
  .banker-quote{
    font-family:'Fraunces',serif;
    font-style:italic;
    font-size:16px;
    color:var(--brass-bright);
    margin:6px 0 16px;
    line-height:1.4;
  }
  .banker-toast{
    position:fixed;
    bottom:24px;
    left:50%;

/* ---------------------------------------------------------------
   SPORT CONFIGS — the architecture the audit flagged as missing.
   Previously calcFP() and the tier bands were hardcoded directly to
   NBA's stat categories and scoring weights, with no abstraction —
   meaning the sport selector elsewhere in the UI implied a capability
   that didn't actually exist. This is that abstraction layer.

   NBA's numbers below are extracted unchanged from what was already
   live (verified via regression check against the old hardcoded
   version before this shipped). NHL's scoring formula uses real,
   current DraftKings NHL DFS weights (skaters: goals/assists/shots/
   blocks; goalies: wins/saves/goals-against/shutouts) — verified via
   search, not invented. NHL's tier bands are explicitly a starting
   placeholder, NOT calibrated against real data the way NBA's were —
   that calibration (like the board-composition simulation work done
   for NBA) needs a real NHL player dataset to do properly, which is
   the next phase of this, not this one.
------------------------------------------------------------------*/
const SPORT_CONFIGS = {
  NBA: {
    label: 'NBA',
    calcFP: (p) => p.pts + p.reb*1.25 + p.ast*1.5 + p.stl*2 + p.blk*2 - p.tov*0.5 + p.tpm*0.5,
    valueBands: [
      { tier:'ELITE', min:24, max:32, fpFloor:50, fpCeil:65 },
      { tier:'STAR',  min:16, max:23, fpFloor:38, fpCeil:50 },
      { tier:'SOLID', min:9,  max:15, fpFloor:26, fpCeil:38 },
      { tier:'VALUE', min:3,  max:8,  fpFloor:0,  fpCeil:26 },
    ],
    rarityTiers: [
      { name: 'ELITE', min: 50,  color: '#6fe0cf', glow: 'rgba(111,224,207,0.55)', foil: true  },
      { name: 'STAR',  min: 38,  color: '#c98fd6', glow: 'rgba(201,143,214,0.45)', foil: true  },
      { name: 'SOLID', min: 26,  color: '#6fb3d9', glow: 'rgba(111,179,217,0.35)', foil: false },
      { name: 'VALUE', min: 0,   color: '#9aa39b', glow: 'rgba(154,163,155,0.25)', foil: false },
    ],
  },
  NHL: {
    label: 'NHL',
    // Verified DraftKings NHL DFS scoring (skater/goalie split — a
    // structurally different shape than NBA's single uniform formula,
    // since the two positions have nothing statistically in common).
    calcFP: (p) => {
      if(p.isGoalie){
        return (p.wins||0)*6 + (p.saves||0)*0.7 - (p.goalsAgainst||0)*3.5 + (p.shutouts||0)*4;
      }
      return (p.goals||0)*8.5 + (p.assists||0)*5 + (p.shots||0)*1.5 + (p.blocks||0)*1.3 + (p.shPoints||0)*2;
    },
    // CALIBRATED against the real 169-player NHL_POOL (verified by computing
    // calcFP for every real player and rank-ordering the result — same
    // approach as NBA's bands, which were calibrated against its real
    // 567-player pool). This replaces an earlier placeholder that was never
    // actually checked against real data: those thresholds (ELITE 35+, STAR
    // 24+) were unreachable by ANY player in the real pool — the highest
    // real FP in the whole dataset is Nathan MacKinnon at 17.4 — so every
    // NHL board would have rendered 0% Elite, 0% Star, 100% Solid/Value,
    // silently defeating the entire rarity/foil system for this sport.
    // These floors instead target the same top-heavy shape NBA's pool has
    // (~1% Elite, ~7% Star, ~18% Solid, rest Value): 16.5 puts exactly the
    // top 2 real players (MacKinnon, McDavid) in Elite; 13.2 captures the
    // next real tier (Kucherov down through Eichel/Kaprizov) as Star; 11.4
    // brings the cumulative Elite+Star+Solid count to ~43 of 169 players.
    valueBands: [
      { tier:'ELITE', min:24, max:32, fpFloor:16.5, fpCeil:18   },
      { tier:'STAR',  min:16, max:23, fpFloor:13.2, fpCeil:16.5 },
      { tier:'SOLID', min:9,  max:15, fpFloor:11.4, fpCeil:13.2 },
      { tier:'VALUE', min:3,  max:8,  fpFloor:0,    fpCeil:11.4 },
    ],
    rarityTiers: [
      { name: 'ELITE', min: 16.5, color: '#6fe0cf', glow: 'rgba(111,224,207,0.55)', foil: true  },
      { name: 'STAR',  min: 13.2, color: '#c98fd6', glow: 'rgba(201,143,214,0.45)', foil: true  },
      { name: 'SOLID', min: 11.4, color: '#6fb3d9', glow: 'rgba(111,179,217,0.35)', foil: false },
      { name: 'VALUE', min: 0,    color: '#9aa39b', glow: 'rgba(154,163,155,0.25)', foil: false },
    ],
  },
};

function calcFP(p, sport){ return SPORT_CONFIGS[sport || 'NBA'].calcFP(p); }

function tierAndCostForFP(fp, sport){
  const bands = SPORT_CONFIGS[sport || 'NBA'].valueBands;
  const band = bands.find(b => fp >= b.fpFloor) || bands[bands.length-1];
  const clamped = Math.max(band.fpFloor, Math.min(band.fpCeil, fp));
  const pos = (clamped - band.fpFloor) / (band.fpCeil - band.fpFloor);
  return { tier: band.tier, cost: Math.round(band.min + pos * (band.max - band.min)) };
}

function buildPoolForSport(sport, rawPlayers){
  return rawPlayers.map(p => {
    const fp = Math.round(calcFP(p, sport) * 10) / 10;
    const { tier, cost } = tierAndCostForFP(fp, sport);
    return { player: p.name, value: fp, cost, tier, baseFP: fp, team: p.team, pos: p.pos || null };
  });
}

const FULL_POOL = buildPoolForSport('NBA', RAW_PLAYERS);

/* ---------------------------------------------------------------
   SEEDED RANDOMNESS — declared here, before sampleBoard, because
   DEFAULT_BOARD below calls sampleBoard() immediately at script-load
   time. `let` declarations aren't usable before their own line runs
   (unlike `function`, which hoists) — activeRng was previously declared
   further down the file, so that very first sampleBoard() call hit the
   temporal dead zone and threw before anything could render.

   Free Play should stay genuinely random every time. Daily Challenge
   needs the opposite: everyone who plays today should see the same
   board CONTENT (which 26 players/values are in play), so results are
   actually comparable. activeRng is the single switch controlling this
   — sampleBoard/buildTonightPool/stratifiedTierSample all read from it.
   The per-person case-NUMBER shuffle (shuffle(), used in
   buildCasesFromBoard) deliberately still uses Math.random() directly
   and is never seeded — that's what keeps two people on the same daily
   board from being able to compare which case number to pick,
   preserving the "your case order is still your own" guarantee from
   the original design.
------------------------------------------------------------------*/
let activeRng = Math.random;

function makeSeededRng(seedStr){
  // mulberry32 — small, fast, deterministic for a given 32-bit seed.
  let seed = 0;
  for(let i = 0; i < seedStr.length; i++){
    seed = (seed * 31 + seedStr.charCodeAt(i)) >>> 0;
  }
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// DEFAULT_BOARD is the opening round's 26-card sample from the credit-priced
// pool (1 held + 24 opened via ROUND_SCHEDULE + 1 held back for the dramatic
// "final two cases" comparison — the schedule sums to exactly 24, so the
// board needs 25 non-held cases, not 24, or the final-reveal panel would
// try to read a case that doesn't exist). Real players, real fixed pricing,
// instead of the original's hardcoded dollar-value legends list. Later
// rounds draw fresh samples via generateRoundBoard() (defined further down,
// alongside the season wrapper).
function sampleBoard(pool, size){
  // FIX (audit finding): pure uniform sampling from a pool that's 75%
  // Value-tier meant ~78% of boards had ZERO Elite-tier cases at all —
  // the game's own rarity system (colors, foil treatment, tier names)
  // rarely got to show off its top tier. Simulated against the real
  // 567-player pool to calibrate this: guaranteeing 1 Elite + up to 3
  // total Star-or-better cards (when available) brings zero-Elite boards
  // from 78% down to 0%, while keeping the board ~67% Value-tier overall
  // — preserving the "mostly modest, a few exciting ones" DOND shape
  // rather than over-correcting into an evenly-split board (a naive
  // round-robin across all 4 tiers was tested and rejected: with only 5
  // Elite players in the whole pool, it would put nearly all of them on
  // almost every board, making Elite guaranteed instead of special).
  // Gracefully degrades on thin pools (a 1-2 game organic slate) that
  // don't have enough Elite/Star players to satisfy the guarantee —
  // .slice() on a short/empty array just returns what's there.
  const MIN_ELITE = 1;
  const MIN_STAR_PLUS = 3;
  const elite = pool.filter(p => p.tier === 'ELITE').sort(()=>activeRng()-0.5);
  const star = pool.filter(p => p.tier === 'STAR').sort(()=>activeRng()-0.5);
  const guaranteed = elite.slice(0, MIN_ELITE);
  const starNeeded = Math.max(0, MIN_STAR_PLUS - guaranteed.length);
  guaranteed.push(...star.slice(0, starNeeded));

  const guaranteedNames = new Set(guaranteed.map(p => p.player));
  const rest = pool.filter(p => !guaranteedNames.has(p.player));
  const targetSize = Math.min(size, pool.length);
  const fillerCount = Math.max(0, targetSize - guaranteed.length);
  const filler = rest.slice().sort(()=>activeRng()-0.5).slice(0, fillerCount);

  return guaranteed.concat(filler)
    .sort(()=>activeRng()-0.5)
    .slice(0, targetSize)
    .map(c => ({ value: c.value, cost: c.cost, player: c.player, team: c.team, pos: c.pos }));
}

/* ---------------------------------------------------------------
   SEASON WRAPPER — the original engine (pickCase/openCase/triggerRing/
   computeOffer/takeDeal/declineDeal, every render function) is reused
   completely unchanged for each individual round. This wrapper just
   tracks the 5-round roster and redirects the two "Play again" buttons
   to advance to the next round instead of restarting from scratch.
   No credit/budget constraint — each round draws from every real player
   not already on the roster. Credits were removed entirely after testing
   showed the budget filter distorted later rounds toward cheap picks only,
   working against the actual goal of a strong lineup.
------------------------------------------------------------------*/
// SEASON_ROUNDS — length of a completed lineup. NBA stays 5, matching 5
// basketball starters. NHL is 6, matching the real on-ice unit: 3
// forwards + 2 defensemen + 1 goalie is literally what a hockey team has
// on the ice at once — not NBA's round count reused for convenience,
// which is what the first pass at this did.
function getSeasonRounds(sport){
  return (sport || 'NBA').toUpperCase() === 'NHL' ? 6 : 5;
}

/* ---------------------------------------------------------------
   ORGANIC SLATE SIZING — the board shouldn't always pretend it's a
   full 10-game night. A real light slate (1-2 games, e.g. NBA Finals)
   only has ~16-36 rotation-relevant players actually playing. This
   builds tonight's candidate pool from a simulated game count, with
   a stratified-by-tier backfill when even that's too thin to function.
   NOTE: `slateGamesTonight` is simulated here — wiring this to a real
   live NBA schedule needs an actual schedule API, a genuine backend
   integration this sandboxed file can't provide on its own.
------------------------------------------------------------------*/
const MIN_VIABLE_BOARD = 6;   // below this, Deal-or-No-Deal doesn't really function
const IDEAL_BOARD = 26;       // 1 held + 24 opened via ROUND_SCHEDULE + 1 held back for the final reveal
let slateGamesTonight = null; // null = full slate (every player eligible)
let setupDetailsOpen = null; // null = not yet determined — see renderSetupPanel, which sets a
// smart default (open if Daily Challenge isn't playable yet, closed once it is) exactly once,
// then respects whatever the user does with it afterward.

let lineupViewMode = 'best'; // 'best' | 'history' — which tab renderLineupPanel shows.
// Resets to 'best' each time the panel is entered fresh (see viewLineupBtn handler)
// rather than persisting across navigation, so it doesn't feel sticky/surprising.

function stratifiedTierSample(pool, count){
  // Round-robins across tiers so a small backfill sample still gets a real
  // spread, instead of happening to grab all-Value or all-Elite by chance.
  const byTier = { ELITE:[], STAR:[], SOLID:[], VALUE:[] };
  pool.forEach(p => byTier[p.tier].push(p));
  Object.values(byTier).forEach(arr => arr.sort(()=>activeRng()-0.5));
  const order = ['ELITE','STAR','SOLID','VALUE'];
  const picked = [];
  let i = 0;
  while(picked.length < count && order.some(t=>byTier[t].length>0)){
    const t = order[i % 4];
    if(byTier[t].length) picked.push(byTier[t].shift());
    i++;
  }
  return picked;
}

// FIX (multi-sport audit): buildTonightPool/startNewSeason/generateRoundBoard
// were all hardcoded to FULL_POOL (NBA only) — NHL had a real scoring config
// and a real player pool, but nothing that actually built a game around it.
// getPoolForSport() is the single place that resolves "which pool" so every
// caller below stays in sync instead of drifting.
function getPoolForSport(sport){
  return (sport || 'NBA').toUpperCase() === 'NHL' ? NHL_POOL : FULL_POOL;
}

/* ---------------------------------------------------------------
   POSITION SLOTS — NHL only. Real fantasy hockey (DFS or season-long)
   always requires filling specific positions — you can't build a "5 best
   players" lineup with zero regard for role the way the game previously
   did. This is now a genuine 6-slot mini-roster matching the real on-ice
   unit in hockey: 3 forwards + 2 defensemen + 1 goalie, the actual six
   players a team has on the ice at once (not NBA's 5-round count reused
   for convenience, which the first pass at this did). The 3 forward slots
   are 1 center + 2 wings, mirroring a real forward line (C+LW+RW) rather
   than 3 undifferentiated forward slots — 'W' accepts either LW or RW,
   same as how DraftKings' own wing slots treat them interchangeably. NBA
   is untouched — getRoundSlot returns null for any non-NHL sport, so
   generateRoundBoard's behavior there is exactly what it was before.
------------------------------------------------------------------*/
const NHL_POSITION_SLOTS = ['C', 'W', 'W', 'D', 'D', 'G'];

function getRoundSlot(roundNumber, sport){
  if((sport || 'NBA').toUpperCase() !== 'NHL') return null;
  return NHL_POSITION_SLOTS[(roundNumber - 1) % NHL_POSITION_SLOTS.length] || null;
}

function slotMatchesPosition(slot, playerPos){
  if(slot === 'W') return playerPos === 'LW' || playerPos === 'RW';
  return playerPos === slot;
}

function slotLabel(slot){
  switch(slot){
    case 'C': return 'Center';
    case 'W': return 'Wing';
    case 'D': return 'Defenseman';
    case 'G': return 'Goalie';
    default: return '';
  }
}

// Shared by both the very first round (startNewSeason/startDailyChallenge,
// which sample directly) and every later round (generateRoundBoard) so the
// position-lock can't drift out of sync between them. For NBA, getRoundSlot
// returns null and this is a pure passthrough — unchanged behavior.
function getEligiblePoolForRound(pool, roundNumber, sport, rosteredNames){
  const eligible = pool.filter(p => !rosteredNames.includes(p.player));
  const slot = getRoundSlot(roundNumber, sport);
  if(!slot) return eligible;
  const positional = eligible.filter(p => slotMatchesPosition(slot, p.pos));
  if(positional.length >= MIN_VIABLE_BOARD) return positional;
  // Graceful degrade: a thin "tonight" slate can leave too few real
  // options at a given position (defensemen are the thinnest position in
  // the real dataset at 19 total) — backfill from the FULL sport pool at
  // that same position rather than breaking the position-lock. Position
  // correctness matters more than staying within "tonight's teams" here;
  // that tradeoff only kicks in on genuinely thin slates.
  const fullPositional = getPoolForSport(sport)
    .filter(p => slotMatchesPosition(slot, p.pos) && !rosteredNames.includes(p.player));
  return fullPositional.length ? fullPositional : positional;
}

function buildTonightPool(gamesTonight, sport){
  const sourcePool = getPoolForSport(sport);
  if(gamesTonight === null){
    return { pool: sourcePool.map(p => ({...p, source:'TONIGHT'})), tonightCount: sourcePool.length, backfillCount: 0, teams: null };
  }
  // FIX: this used to just grab a random COUNT of players regardless of
  // team — meaning a "1 game" slate could show players from a dozen
  // different teams, which is obviously impossible for a real single
  // matchup. Now it picks actual teams first, then filters to only
  // players on those teams. Pool now covers all 30 real teams (min 4
  // players each, from a real 186-player dataset), so a 1-2 game slate
  // should usually be viable on real "tonight" players alone, without
  // needing backfill — a big improvement over the earlier 55-player
  // dataset where several teams had only 1 player. Backfill still exists
  // as a safety net for the rare thin combination (e.g. two 4-player teams).
  // Same logic now applies to NHL's 32-team pool via sourcePool.
  const allTeams = [...new Set(sourcePool.map(p => p.team))];
  const neededTeams = Math.min(allTeams.length, gamesTonight * 2);
  const selectedTeams = allTeams.slice().sort(()=>activeRng()-0.5).slice(0, neededTeams);

  const tonight = sourcePool.filter(p => selectedTeams.includes(p.team)).map(p => ({...p, source:'TONIGHT'}));
  const reserve = sourcePool.filter(p => !selectedTeams.includes(p.team));

  let pool = tonight;
  let backfillCount = 0;
  if(pool.length < MIN_VIABLE_BOARD){
    const needed = MIN_VIABLE_BOARD - pool.length;
    const backfill = stratifiedTierSample(reserve, needed).map(p => ({...p, source:'BACKFILL (recent form)'}));
    pool = [...pool, ...backfill];
    backfillCount = backfill.length;
  }
  if(pool.length > IDEAL_BOARD) pool = pool.slice().sort(()=>activeRng()-0.5).slice(0, IDEAL_BOARD);
  return { pool, tonightCount: tonight.length, backfillCount, teams: selectedTeams };
}

let season = { roster: [], roundNumber: 1, candidatePool: FULL_POOL, slateInfo: null };

function generateRoundBoard(){
  // FIX: credits/budget removed from the game entirely — the constraint was
  // actively distorting later rounds toward cheap Value-tier picks only,
  // working against the actual goal (a strong lineup). Rounds only
  // exclude players already on the roster; every real player still eligible
  // TONIGHT (respecting the organic slate size) is always in play — now
  // also respecting the round's required position slot for NHL (see
  // getEligiblePoolForRound above).
  const rosteredNames = season.roster.map(r => r.player);
  const eligible = getEligiblePoolForRound(season.candidatePool, season.roundNumber, state.currentSport, rosteredNames);
  return sampleBoard(eligible, 26);
}

function advanceSeasonRound(playerName, playerFP, playerPos){
  // Historical Run Analysis: capture the best value genuinely available to
  // the player THIS round, before state.declinedOffers gets wiped by the
  // next startGame() call. Deliberately NOT "the highest card on the
  // board" — when a deal is taken, the held case is never actually opened
  // (see takeDeal/findClosestPlayerByValue), so its true value is
  // permanently unknown to both the player and the game itself; claiming
  // otherwise would be reporting fiction as feedback. This is instead the
  // best number the player was REALLY offered and could have chosen at any
  // decision point this round: every offer they saw and declined, plus
  // whatever they actually walked away with. If they took the biggest
  // offer they were ever shown (or their case beat every offer they
  // turned down), maxPossibleFP === playerFP — a clean decision. If a
  // later smaller deal was taken after a bigger one was declined, or a
  // held case came in under an offer that was passed on, maxPossibleFP is
  // higher — real, honest, decision-based "value left on the table."
  const offersThisRound = state.declinedOffers.map(d => d.offer);
  const maxPossibleFP = Math.max(playerFP, ...offersThisRound);
  // Board Ceiling: the OTHER framing, deliberately including luck rather
  // than isolating it out — the single best card that actually existed on
  // this round's board, whether or not the player ever had real access to
  // it (they only ever controlled ONE case; this ignores that constraint
  // on purpose). state.cases still holds the just-completed round's board
  // here, before startGame() replaces it for the next round below.
  const boardCeilingFP = Math.max(...state.cases.map(c => c.value));
  season.roster.push({ player: playerName, fp: playerFP, round: season.roundNumber, pos: playerPos || null, maxPossibleFP, boardCeilingFP });
  document.getElementById('finaleOverlay').classList.add('hidden');
  if(season.roster.length >= getSeasonRounds(state.currentSport)){
    // FIX: this is now the ONLY place a completed lineup gets saved and the
    // daily streak gets marked — previously both fired after EVERY round,
    // meaning a user could get daily credit after finishing just Round 1.
    // Free play still works exactly the same; it just doesn't feed My
    // Lineup, so a saved lineup actually reflects real daily results.
    if(state.isDailyMode){
      saveSeasonToLineup(season.roster, state.currentSport);
      markDailyCompleted();
      clearDailyProgress(); // finished — the mid-game snapshot is no longer
      // needed now that the real result is durably saved above.
    }
    renderSeasonSummary();
    return;
  }
  // FIX: generateRoundBoard() reads season.roundNumber to pick the position
  // slot for NHL (see getRoundSlot). It has to run AFTER the increment below,
  // not before — calling it first meant every round's board was generated
  // using the position slot of the round that just finished, not the one
  // about to start, so e.g. the goalie round would still show defensemen.
  season.roundNumber++;
  const nextBoard = generateRoundBoard();
  if(nextBoard.length < 3){
    if(state.isDailyMode) clearDailyProgress(); // rare "ran out of eligible
    // players" edge case is also terminal — don't leave a stale mid-game
    // snapshot around that a later reload would try to resume into.
    renderSeasonSummary(true);
    return;
  }
  startGame(nextBoard);
}

// FIX: wasn't sport-aware — 125 is calibrated to NBA's FP scale (roughly
// 5 Solid-tier-or-better rounds), but NHL's real FP totals run far lower
// (SOLID tier alone is ~11-13 FP vs NBA's ~26-38), so an NHL season could
// almost never reach 125 and would essentially never trigger the "big
// win" celebration. NHL's threshold below is calibrated the same way —
// roughly what its own 6 Solid-tier-or-better rounds average out to.
function getSeasonBigWinThreshold(sport){
  return (sport || 'NBA').toUpperCase() === 'NHL' ? 75 : 125;
}
// Separate from BIG_WIN_THRESHOLD (50), which is calibrated for a single
// NBA case reveal, not a full season total, and isn't sport-scaled either
// — see BIG_WIN_THRESHOLD's own definition below for that one.

function renderSeasonSummary(incomplete){
  const totalFP = Math.round(season.roster.reduce((s,r) => s + r.fp, 0) * 10) / 10;
  state.phase = 'season-complete';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('board').innerHTML = '';
  document.getElementById('ladder').innerHTML = '';
  // FIX: without this, the status strip stayed frozen on the last active
  // round's state ("Final reveal · 1 case left · Your case #5") even after
  // the season summary below it showed "5/5 rounds complete" — contradictory
  // and confusing since the two panels visibly disagreed with each other.
  document.getElementById('statusStrip').style.display = 'none';
  // FIX: same stale-data problem as the status strip — this panel is only
  // ever refreshed via the main render() dispatcher, which renderSeasonSummary
  // never calls (it manipulates the DOM directly). Without this explicit
  // clear it kept showing whatever was on screen before the final round
  // resolved (e.g. Rounds 1-4) even after the summary below correctly
  // showed all 5 rounds complete.
  document.getElementById('seasonLineupPanel').innerHTML = '';

  if(incomplete){
    // An incomplete season isn't the achievement moment — no fanfare here,
    // just a clear explanation and a clearly-labeled way forward. (Audit
    // finding: this button used to just say "Start New Season" with no
    // indication it's switching to Free Play, not retrying today's
    // Daily Challenge — that ambiguity is why the label is explicit now.)
    document.getElementById('finalPanel').innerHTML = `
      <div class="panel">
        <h2>Season Incomplete</h2>
        <p>Ran out of eligible players — locked in ${season.roster.length}/${getSeasonRounds(state.currentSport)}.</p>
        <ul class="history-list">${season.roster.map(r=>`<li><span class="round-tag">${r.pos ? r.pos+' · ' : ''}Round ${r.round}</span> <strong>${r.player}</strong> — ${fmt(r.fp)}</li>`).join('')}</ul>
        <div class="panel-actions">
          <button class="primary" id="newSeasonBtn">Start New Season (Free Play)</button>
        </div>
      </div>
    `;
    document.getElementById('newSeasonBtn').onclick = () => startNewSeason();
    return;
  }

  document.getElementById('finalPanel').innerHTML = '';

  // Real finale treatment — reuses the same overlay used for individual
  // Deal moments, so the biggest moment in the product gets the same
  // level of visual weight as a single round's decision, not less.
  const bankerLine = pickBankerLine(totalFP >= getSeasonBigWinThreshold(state.currentSport) ? 'seasonCompleteStrong' : 'seasonCompleteAverage');
  const shareText = buildShareText({
    resultLine: `I built a ${fmt(totalFP)} lineup in Fantasy Vault!`,
    passedLine: season.roster.map(r => r.player).join(' · ')
  });

  // Historical Run Analysis — see advanceSeasonRound for what maxPossibleFP
  // actually means (best offer genuinely available each round, never a
  // hypothetical about an unopened held case). Rounded per-round before
  // summing so this total always matches what the per-round rows below add
  // up to, rather than drifting from independent rounding.
  const totalMaxPossibleFP = Math.round(season.roster.reduce((s,r) => s + Math.round((r.maxPossibleFP ?? r.fp) * 10) / 10, 0) * 10) / 10;
  const efficiencyPct = totalMaxPossibleFP > 0 ? Math.round((totalFP / totalMaxPossibleFP) * 100) : 100;
  const gapFP = Math.round((totalMaxPossibleFP - totalFP) * 10) / 10;
  // Board Ceiling: the OTHER framing — sum of the single best card on every
  // round's board, luck included on purpose (see advanceSeasonRound). This
  // will almost always show a bigger gap than Decision Efficiency, since
  // it's not pretending the player ever had a real shot at every card —
  // it's answering "how much upside was sitting on the table," not "did
  // you play your actual hand well."
  const totalBoardCeilingFP = Math.round(season.roster.reduce((s,r) => s + Math.round((r.boardCeilingFP ?? r.fp) * 10) / 10, 0) * 10) / 10;
  const capturedPct = totalBoardCeilingFP > 0 ? Math.round((totalFP / totalBoardCeilingFP) * 100) : 100;

  const rows = season.roster.map((r, i) => {
    const p = getPoolForSport(state.currentSport).find(x => x.player === r.player);
    const tier = p ? p.tier : 'VALUE';
    const color = getTierColorByName(tier, state.currentSport);
    const roundMax = Math.round((r.maxPossibleFP ?? r.fp) * 10) / 10;
    const roundGap = Math.round((roundMax - r.fp) * 10) / 10;
    // Only call out rounds where a real gap exists — tagging every single
    // row "best available" when there was nothing to compare against (or
    // nothing was left on the table) is just noise, not feedback.
    const gapTag = roundGap > 0.05 ? `<span class="round-gap-tag">left ${fmt(roundGap)} on the table</span>` : '';
    return `<div class="lineup-mini-row season-reveal-row" style="animation-delay:${(i*0.15).toFixed(2)}s;">
      <span class="round-tag">${r.pos ? r.pos+' · ' : ''}R${r.round}</span>
      <span class="lineup-mini-player" style="color:${color};">${r.player}</span>
      <span class="lineup-mini-fp">${fmt(r.fp)}${gapTag}</span>
    </div>`;
  }).join('');

  const analysisHtml = `
    <div class="run-analysis">
      <p class="run-analysis-label">Historical Run Analysis</p>
      <div class="run-analysis-row">
        <span>Actual Achieved</span>
        <strong>${fmt(totalFP)}</strong>
      </div>
      <div class="run-analysis-row">
        <span>Board Ceiling <span class="run-analysis-hint">(best card, any round)</span></span>
        <strong>${fmt(totalBoardCeilingFP)}</strong>
      </div>
      <div class="run-analysis-row run-analysis-efficiency">
        <span>Captured</span>
        <strong>${capturedPct}%</strong>
      </div>
      <div class="run-analysis-divider"></div>
      <div class="run-analysis-row">
        <span>Maximum Possible <span class="run-analysis-hint">(best offer you saw)</span></span>
        <strong>${fmt(totalMaxPossibleFP)}</strong>
      </div>
      <div class="run-analysis-row run-analysis-efficiency">
        <span>Decision Efficiency</span>
        <strong>${efficiencyPct}%</strong>
      </div>
      <p class="run-analysis-note">Board Ceiling counts the single best card on every board, including ones you never held — a measure of upside, luck included. Decision Efficiency only counts offers you actually saw, since which case you first grabbed was always luck, never skill. ${gapFP > 0.05
        ? `You left ${fmt(gapFP)} on the table this run against the offers you actually saw.`
        : `You took the best offer available to you in every round — decision-optimal given what you were actually shown.`
      }</p>
    </div>
  `;

  const overlay = document.getElementById('finaleOverlay');
  const inner = document.getElementById('finaleOverlayInner');
  inner.innerHTML = `
    <p class="finale-eyebrow">Fantasy Vault</p>
    <p class="finale-title">Your Vault Is Complete</p>
    <p class="banker-quote" style="text-align:center;">"${bankerLine}"</p>
    <div class="season-total-hero">
      <p class="season-total-value">${fmt(totalFP)}</p>
      <p class="season-total-label">Total Lineup FP</p>
    </div>
    ${analysisHtml}
    <div class="lineup-card season-card season-reveal-card">
      <div class="lineup-mini-list">${rows}</div>
    </div>
    <div class="panel-actions" style="justify-content:center;">
      <button id="shareSeasonBtnOverlay">Share</button>
      <button id="viewLineupBtnOverlay">View My Lineup</button>
      <button class="primary" id="newSeasonBtnOverlay">Start New Season</button>
    </div>
  `;
  overlay.classList.remove('hidden');
  celebrateIfBig(totalFP, getSeasonBigWinThreshold(state.currentSport));

  document.getElementById('shareSeasonBtnOverlay').onclick = (e) => {
    const imagePayload = {
      mode: 'season',
      totalFP: fmt(totalFP),
      players: season.roster.map(r => ({ player: r.player, round: r.round, pos: r.pos || null, fp: fmt(r.fp) })),
    };
    shareOrCopy(shareText, imagePayload, e.target);
  };
  document.getElementById('viewLineupBtnOverlay').onclick = () => {
    overlay.classList.add('hidden');
    lineupViewMode = 'best';
    state.phase = 'lineup';
    render();
  };
  document.getElementById('newSeasonBtnOverlay').onclick = () => {
    overlay.classList.add('hidden');
    startNewSeason();
  };
}

function startNewSeason(){
  // Shared by every "start a fresh season" entry point so the organic
  // slate-sizing logic can't drift out of sync between them. Explicitly
  // reset to genuine randomness first — activeRng may still be pointing
  // at a seeded generator if a Daily Challenge ran earlier this page load.
  activeRng = Math.random;
  state.isDailyMode = false; // FIX: this used to be set inside startGame()
  // itself, which meant every round-to-round call from advanceSeasonRound()
  // (Daily Challenge's own round 2+ progression) silently reset it back to
  // false mid-session — see startGame's comment for the full explanation.
  const { pool, tonightCount, backfillCount, teams } = buildTonightPool(slateGamesTonight, state.currentSport);
  season = { roster: [], roundNumber: 1, candidatePool: pool, slateInfo: { tonightCount, backfillCount, total: pool.length, teams } };
  const eligible = getEligiblePoolForRound(pool, 1, state.currentSport, []);
  startGame(sampleBoard(eligible, 26));
}

/* ---------------------------------------------------------------
   RARITY TIERS — now sport-aware via SPORT_CONFIGS[sport].rarityTiers
   instead of a single NBA-only global. `sport` defaults to
   state.currentSport so every existing call site (case rendering,
   the ladder, the Banker's tier checks) keeps working unmodified —
   they're all called while a specific sport's round is actually in
   progress, so state.currentSport is always the right answer.
   RARITY_TIERS is kept as a plain export of NBA's tiers for any
   external reference, but internal lookups all go through here.
------------------------------------------------------------------*/
const RARITY_TIERS = SPORT_CONFIGS.NBA.rarityTiers;

function getRarityTiers(sport){
  const key = (sport || state.currentSport || 'NBA').toUpperCase();
  return (SPORT_CONFIGS[key] || SPORT_CONFIGS.NBA).rarityTiers;
}

function getRarityTier(value, sport){
  const tiers = getRarityTiers(sport);
  return tiers.find(t => value >= t.min) || tiers[tiers.length-1];
}

function getTierColorByName(tierName, sport){
  const tiers = getRarityTiers(sport);
  const match = tiers.find(t => t.name === tierName);
  return (match || tiers[tiers.length-1]).color;
}

function rarityBadgeHtml(value){
  const t = getRarityTier(value);
  return `<span class="rarity-badge" style="color:${t.color};border:1px solid ${t.color};background:${t.glow};">${t.name}</span>`;
}

function rarityCardStyle(value){
  const t = getRarityTier(value);
  const classes = 'has-rarity' + (t.foil ? ' has-foil' : '');
  const style = `border-color:${t.color} !important; box-shadow:0 0 0 1px ${t.glow}, 0 0 30px ${t.glow} !important;`;
  return { classes, style };
}

function getContrastTextColor(hex){
  // Standard perceived-luminance formula, picks whichever text color
  // actually contrasts against a given background — can't just assume
  // white always works, since some team colors (San Antonio's silver,
  // for instance) are light enough that white text would be just as
  // illegible as dark team colors were against the app's dark background.
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const luminance = (0.299*r + 0.587*g + 0.114*b);
  return luminance > 140 ? '#12161c' : '#ffffff';
}

function teamBadgeHtml(team, sport){
  if(!team) return '';
  const key = (sport || state.currentSport || 'NBA').toUpperCase();
  const bg = (TEAM_COLORS[key] && TEAM_COLORS[key][team]) || '#3a3f47';
  const textColor = getContrastTextColor(bg);
  return `<span class="team-badge" style="background:${bg};color:${textColor};">${team}</span>`;
}

// FIX: pure Math.random() with only 2-5 lines per category meant a real
// chance of the exact same line repeating immediately — especially since
// the priority logic in computeBankerLine() often locks into the same
// category for several consecutive offers (e.g. "final stretch" fires on
// every offer once you're down to 3 cases). Now tracks the last line shown
// PER CATEGORY and excludes it from the next pick in that same category,
// guaranteeing no literal back-to-back repeat.
let lastBankerLineByCategory = {};

// Spelled-out round count for banker dialogue ("Five rounds", "Six rounds")
// — NBA is 5, NHL is 6 (see getSeasonRounds). Only spells out the numbers
// actually in play; falls back to the digit for anything else.
const ROUND_COUNT_WORDS = { 5: 'Five', 6: 'Six' };
function roundsWord(sport){
  const n = getSeasonRounds(sport);
  return ROUND_COUNT_WORDS[n] || String(n);
}

function pickBankerLine(category){
  const lines = BANKER_LINES[category] || BANKER_LINES.opening;
  const last = lastBankerLineByCategory[category];
  const candidates = lines.length > 1 ? lines.filter(l => l !== last) : lines;
  const chosen = candidates[Math.floor(Math.random() * candidates.length)];
  lastBankerLineByCategory[category] = chosen;
  return chosen.includes('{rounds}') ? chosen.split('{rounds}').join(roundsWord(state.currentSport)) : chosen;
}

function getTopPrizeStatus(){
  const topValue = Math.max(...state.cases.map(c => c.value));
  const topCase = state.cases.find(c => c.value === topValue);
  const gone = topCase.opened && topCase.num !== state.heldCaseNum;
  return gone ? 'topPrizeGone' : 'topPrizeAlive';
}

function computeBankerLine(){
  // Priority order matters — most dramatic/specific context wins.
  const remaining = state.cases.filter(c => !c.opened && c.num !== state.heldCaseNum);
  const last = state.lastOpenedCase;
  const lastTier = last ? getRarityTier(last.value).name : null;

  if(remaining.length <= 3) return pickBankerLine('finalStretch');
  if(state.declinedOffers.length >= 2) return pickBankerLine('aggressive');
  if(getTopPrizeStatus() === 'topPrizeGone' && Math.random() < 0.5) return pickBankerLine('topPrizeGone');
  if(last && (lastTier === 'ELITE' || lastTier === 'STAR')) return pickBankerLine('eliminatedHigh');
  if(last && lastTier === 'VALUE') return pickBankerLine('eliminatedLow');

  const strongRemaining = remaining.filter(c => {
    const t = getRarityTier(c.value).name;
    return t === 'ELITE' || t === 'STAR';
  }).length;
  if(strongRemaining >= 3) return pickBankerLine('strongBoard');

  if(getTopPrizeStatus() === 'topPrizeAlive') return pickBankerLine('topPrizeAlive');

  return pickBankerLine('opening');
}

function getAccolade(name){
  return PLAYER_ACCOLADES[name] || '';
}

/* ---------------------------------------------------------------
   SAVED LINEUP — local, per-browser history of results, used to
   build a "starting lineup" of the player's best pulls over time.
   Lives in localStorage since there's no player login system;
   this is a real standalone site (not a Claude artifact), so
   localStorage is safe and appropriate to use here.

   MULTI-SPORT: every board preset is tagged with a "sport" (see
   the `sport` column on vault_presets, default 'NBA'). Lineups are
   stored PER SPORT — a saved NBA result never mixes with a future
   NFL result — and each sport has its own lineup size (5 for NBA,
   11 for NFL/soccer, etc.) via SPORT_LINEUP_SIZES below. This ONLY
   controls My Lineup's save/display size — it does NOT mean a new
   sport is actually playable. Real scoring/tiers now live in
   SPORT_CONFIGS (see above), which is the piece that was actually
   missing before. NHL is now fully wired up through Free Play (see
   getPoolForSport, buildTonightPool, startNewSeason). NFL/SOCCER/MLB
   below are placeholders only — no scoring config, no data, not
   started, and not selectable anywhere in the player-facing UI.
   NOTE: NHL's lineup size here is 6, matching getSeasonRounds('NHL') — the
   core Deal-or-No-Deal engine now reads its round count per-sport (see
   getSeasonRounds above) rather than a single hardcoded constant, so NHL
   could be given its own real number instead of reusing NBA's. 6 matches
   the actual on-ice unit in hockey: 3 forwards + 2 defensemen + 1 goalie,
   not NBA's round count borrowed for convenience. NFL/SOCCER/MLB
   keep their real roster-size numbers as placeholders for whenever they
   actually get built — those sizes only matter once each sport has its
   own real season loop, which doesn't exist yet.
------------------------------------------------------------------*/
const SPORT_LINEUP_SIZES = {
  NBA: 5,
  NFL: 11,
  SOCCER: 11,
  MLB: 9,
  NHL: 6, // matches getSeasonRounds('NHL') — see note above
};
const DEFAULT_LINEUP_SIZE = 5;

// The only sports with a real pool + real gameplay wired up (see
// getPoolForSport). NFL/SOCCER/MLB exist as placeholders in
// SPORT_LINEUP_SIZES/SPORT_CONFIGS-adjacent data but aren't playable, so
// they're deliberately excluded from the player-facing sport toggle —
// showing them would imply a capability that doesn't exist yet.
const PLAYABLE_SPORTS = ['NBA', 'NHL'];

// Single source of truth for "can this sport ever have a Daily Challenge
// entry" — currently just NBA (see startDailyChallenge, which forces NBA
// unconditionally). This matters beyond startDailyChallenge itself: Best
// Lineups/History are explicitly Daily-only (Free Play doesn't feed them),
// so for any sport NOT in this list, that panel can never receive a real
// entry through legitimate play. The empty-state copy has to say that
// honestly instead of telling an NHL player to "complete a Daily
// Challenge" — an instruction that's structurally impossible for them to
// follow. Update this the same day Daily Challenge actually adds NHL.
const DAILY_ELIGIBLE_SPORTS = ['NBA'];

function getLineupSize(sport){
  return SPORT_LINEUP_SIZES[(sport || 'NBA').toUpperCase()] || DEFAULT_LINEUP_SIZE;
}

/* ---------------------------------------------------------------
   DAILY CHALLENGE
   One shared board per calendar day, deterministically picked from
   whatever presets exist in Supabase (rotates automatically as more
   get added — no manual admin step needed). Case-to-number placement
   is still independently shuffled per person via the normal
   buildCasesFromBoard() shuffle, so no strategic info leaks between
   people comparing results — only the underlying board content
   (which dollar values map to which players) is shared, and that's
   already visible to everyone via the value ladder regardless.

   Once-per-day gating and the streak counter live in localStorage,
   same rationale as the lineup system — no player login exists.
------------------------------------------------------------------*/
function getTodayDateString(){
  return new Date().toISOString().slice(0, 10); // YYYY-MM-DD, UTC
}

function getYesterdayDateString(){
  const d = new Date();
  d.setUTCDate(d.getUTCDate() - 1);
  return d.toISOString().slice(0, 10);
}

function hashDateToIndex(dateStr, modulus){
  if(modulus <= 0) return 0;
  let hash = 0;
  for(let i = 0; i < dateStr.length; i++){
    hash = (hash * 31 + dateStr.charCodeAt(i)) >>> 0;
  }
  return hash % modulus;
}

// FIX: Daily Challenge used to depend entirely on Supabase presets — an
// admin had to manually save boards for it to pick from. With that backend
// disconnected, it could never actually load anything. Replaced with a
// self-contained, deterministic generator: every player gets the exact
// same 26-player pool each round, all 5 rounds, on a given calendar day —
// no admin curation, no external data — while each player's own case
// numbering still shuffles individually (buildCasesFromBoard's shuffle()
// still uses true randomness), matching the original "shared board, your
// case order is still your own" design intent. Uses the activeRng switch
// declared earlier (see SEEDED RANDOMNESS above) rather than threading a
// seed parameter through every board-generation function individually.

function getDailyState(){
  try{
    return {
      startedDate: localStorage.getItem('vault_daily_started_date'),
      streak: parseInt(localStorage.getItem('vault_daily_streak') || '0', 10),
      lastCompletedDate: localStorage.getItem('vault_daily_last_completed_date'),
    };
  } catch(e){
    return { startedDate: null, streak: 0, lastCompletedDate: null };
  }
}

function markDailyStarted(){
  try{ localStorage.setItem('vault_daily_started_date', getTodayDateString()); } catch(e){}
}

function markDailyCompleted(){
  try{
    const today = getTodayDateString();
    const ds = getDailyState();
    if(ds.lastCompletedDate === today) return; // already counted today, don't double-increment
    const streak = ds.lastCompletedDate === getYesterdayDateString() ? ds.streak + 1 : 1;
    localStorage.setItem('vault_daily_streak', String(streak));
    localStorage.setItem('vault_daily_last_completed_date', today);
  } catch(e){}
}

/* ---------------------------------------------------------------
   DAILY PROGRESS PERSISTENCE — markDailyStarted() used to be the only
   record of an in-progress Daily Challenge, and it's written the instant
   the player clicks "Play Today's Vault," before a single case is opened.
   That meant any refresh, crash, or accidental tab close mid-round showed
   a disabled "Come back tomorrow" button for the rest of the day — full
   lockout, zero progress made, no recovery. This persists the actual live
   game (board, roster-so-far, phase, offers) so a reload resumes exactly
   where the player left off instead of just remembering that they once
   clicked a button. Only ever written while a Daily round is genuinely
   live (see saveDailyProgress's phase check) and cleared once the season
   actually finishes, since the finished result is already durably saved
   elsewhere via saveSeasonToLineup/markDailyCompleted at that point.
------------------------------------------------------------------*/
const DAILY_PROGRESS_KEY = 'vault_daily_progress';
const DAILY_PROGRESS_LIVE_PHASES = ['pick','playing','ringing','offer','final','dealt'];

function saveDailyProgress(){
  if(!state.isDailyMode) return;
  if(!DAILY_PROGRESS_LIVE_PHASES.includes(state.phase)) return; // no-op, not a clear —
  // navigating home mid-round (goHome) drops phase to 'setup' without
  // abandoning the attempt, so an already-saved snapshot must survive that.
  const snapshot = {
    date: getTodayDateString(),
    state: {
      phase: state.phase,
      cases: state.cases,
      heldCaseNum: state.heldCaseNum,
      roundIndex: state.roundIndex,
      casesOpenedThisRound: state.casesOpenedThisRound,
      currentOffer: state.currentOffer,
      dealAcceptedValue: state.dealAcceptedValue,
      heldRevealed: state.heldRevealed,
      declinedOffers: state.declinedOffers,
      pendingOfferCases: state.pendingOfferCases,
      lastOpenedCase: state.lastOpenedCase,
      selectedPreset: state.selectedPreset,
      currentSport: state.currentSport,
      isDailyMode: state.isDailyMode,
      bankerLine: state.bankerLine,
      bankerReactionLine: state.bankerReactionLine,
    },
    season: {
      roster: season.roster,
      roundNumber: season.roundNumber,
      candidatePool: season.candidatePool,
      slateInfo: season.slateInfo,
    },
  };
  try{ localStorage.setItem(DAILY_PROGRESS_KEY, JSON.stringify(snapshot)); }catch(e){}
}

function loadDailyProgress(){
  try{
    const raw = localStorage.getItem(DAILY_PROGRESS_KEY);
    if(!raw) return null;
    const snapshot = JSON.parse(raw);
    if(snapshot.date !== getTodayDateString()){
      localStorage.removeItem(DAILY_PROGRESS_KEY); // stale from a prior day
      return null;
    }
    return snapshot;
  }catch(e){ return null; }
}

function clearDailyProgress(){
  try{ localStorage.removeItem(DAILY_PROGRESS_KEY); }catch(e){}
}

function resumeDailyProgress(snapshot){
  Object.assign(state, snapshot.state);
  season = { ...snapshot.season };
  // The board is already fully realized in state.cases/season — nothing
  // downstream needs the original seeded sequence replayed, so a plain
  // Math.random() default is safe from here on (matches what Free Play
  // already uses; only initial board GENERATION needed the daily seed).
  activeRng = Math.random;
  render();
}

/* ---------------------------------------------------------------
   FUTURE WORK — LIVE-GAME LOCK (not implemented yet)

   Today's Vault currently has zero live-game awareness: the board is built
   once per day from season-average stats via a seeded RNG (see
   startDailyChallenge below), and nothing here knows or cares whether an
   actual NBA/NHL game has tipped off. Someone can sit on a pick for hours
   mid-session with no consequence. That's fine today because the results
   aren't tied to real live outcomes — but once Daily Challenge syncs to
   actual games (real box scores driving FP instead of season averages),
   a session that's still open after a relevant game goes live becomes a
   real fairness problem and needs a lock.

   Decided approach, to build when that sync work happens:
   - Do NOT hard-kick the player out of an in-progress session when a game
     goes live. Interrupting mid-reveal or mid-offer-decision over a clock
     ticking over is punitive and fights the whole point of the resume
     work above (this file goes out of its way to not strand people
     mid-session). Same-day resume should keep working exactly as it does
     now regardless of live-lock state.
   - Instead: surface a clear, persistent warning (status-strip banner,
     same pattern as the existing "Drafting: Center" NHL slot indicator —
     NOT a dismissible one-shot modal, which risks getting missed if it
     fires mid-animation) once the slate is locked, and let the player
     finish the run anyway. The finished lineup just doesn't count: no
     saveSeasonToLineup(), no markDailyCompleted()/streak increment. Still
     decide whether it shows up in "My Lineup" tagged as unofficial, or is
     filtered out entirely — TBD.
   - Lock granularity: prefer PER-PLAYER locking (a player becomes
     ineligible for remaining rounds once their specific game has gone
     live — the real fantasy-sports convention) over one blunt
     whole-slate cutoff timestamp. A 7pm game going live shouldn't lock
     someone out of picking from a still-eligible 10pm-game pool. This is
     real added complexity over a single cutoff and may need to be phased
     in — a whole-slate cutoff as a first pass, per-player as a follow-up,
     is a reasonable way to ship this incrementally.
   - Starting a FRESH Daily Challenge after the slate's already live is a
     separate question from an in-progress session hitting the lock mid-
     run — decide whether "Play Today's Vault" itself becomes unavailable,
     or switches to an explicit "practice mode" label, once locked for
     the day.
   - None of this can be built until there's an actual schedule/live-score
     data source wired in; there isn't one today (buildTonightPool's
     "games tonight" simulation is synthetic, not real schedule data).
------------------------------------------------------------------*/

function startDailyChallenge(){
  // Reset first: activeRng may still be pointing at a leftover seeded
  // generator from an earlier Daily session this page load. Then swap in
  // today's seed for the whole session — every board-content call
  // (buildTonightPool, sampleBoard, stratifiedTierSample) reads from
  // activeRng, so all 5 rounds stay consistent with today's seed until
  // Free Play resets it back to genuine randomness.
  activeRng = makeSeededRng(getTodayDateString());

  // Deterministic "how many games tonight" for the day, so the daily board
  // isn't always a flat full-pool sample — same organic sizing logic Free
  // Play uses, just seeded instead of random. Rotates through a fixed set
  // of realistic slate sizes.
  const dailySlateOptions = [null, null, 4, 2]; // weighted toward fuller slates
  const gamesTonight = dailySlateOptions[hashDateToIndex(getTodayDateString(), dailySlateOptions.length)];

  // Daily Challenge stays NBA-only for now (the seeded-RNG/slate-simulation
  // logic here is delicate enough without also threading sport through it) —
  // 'NBA' is passed explicitly so this never accidentally picks up whatever
  // sport the player last had toggled on in Free Play.
  state.currentSport = 'NBA';
  const { pool, tonightCount, backfillCount, teams } = buildTonightPool(gamesTonight, 'NBA');
  season = { roster: [], roundNumber: 1, candidatePool: pool, slateInfo: { tonightCount, backfillCount, total: pool.length, teams } };
  const board = sampleBoard(pool, 26);

  state.selectedPreset = `Daily Challenge — ${getTodayDateString()}`;
  markDailyStarted();
  // FIX: isDailyMode now set BEFORE startGame() rather than after — startGame()
  // no longer touches this flag itself (see its own comment), so setting it
  // here means it's correct from the very first render, and — the actual
  // bug this uncovered — stays correct across every later round too, since
  // advanceSeasonRound() calls startGame() again for rounds 2-5 and that
  // used to silently reset isDailyMode back to false mid-session.
  state.isDailyMode = true;
  startGame(board);
}

function lineupLabel(sport){
  const size = getLineupSize(sport);
  return `Starting ${size}`;
}

function lineupStorageKey(sport){
  return `vault_saved_seasons_v2__${(sport || 'NBA').toUpperCase()}`;
}
const MAX_SAVED_SEASONS = 10; // how many past completed lineups to remember, best-first

function getSavedSeasons(sport){
  try{
    const raw = localStorage.getItem(lineupStorageKey(sport));
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}

/* ---------------------------------------------------------------
   LINEUP HISTORY — separate from the "Best Lineups" list above, which is
   a curated top-MAX_SAVED_SEASONS leaderboard that evicts your weakest
   result the moment a better one comes in. That's the right behavior for
   a bragging-rights showcase, but it means a middling day's lineup is
   just gone forever once you have 10 better ones — no way to see your
   full track record, and no data left for anything trend-based (average
   FP over time, day-by-day history) once live sync exists. History
   is uncapped-in-spirit (capped high, not by rank) and evicts by AGE, not
   by strength — every completed Daily Challenge stays here regardless of
   how it scored, until the cap is hit. Each entry stored once, shared
   between the two lists rather than duplicated — see saveSeasonToLineup.
------------------------------------------------------------------*/
function historyStorageKey(sport){
  return `vault_lineup_history_v1__${(sport || 'NBA').toUpperCase()}`;
}
const MAX_HISTORY_ENTRIES = 365; // a year's worth of daily entries — generous,
// not truly unlimited, so localStorage can't grow without bound. Each entry
// is a few hundred bytes, so even a full year is comfortably under 1MB.

function getLineupHistory(sport){
  try{
    const raw = localStorage.getItem(historyStorageKey(sport));
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch(e){ return []; }
}

function appendToHistory(entry, sport){
  try{
    let history = getLineupHistory(sport);
    history.push(entry);
    // Evict OLDEST when over the cap — the opposite eviction rule from
    // Best Lineups (which evicts weakest). Sort newest-first for storage
    // and display; slice keeps the most RECENT entries, not the highest-FP
    // ones, which is the whole point of this list being separate.
    history.sort((a, b) => new Date(b.date) - new Date(a.date));
    history = history.slice(0, MAX_HISTORY_ENTRIES);
    localStorage.setItem(historyStorageKey(sport), JSON.stringify(history));
  } catch(e){ /* localStorage unavailable — silently skip, same as saveSeasonToLineup */ }
}

function saveSeasonToLineup(seasonRoster, sport){
  // FIX: this used to be called once PER ROUND (via saveResultToLineup),
  // saving a single disconnected player entry each time — a completed
  // 5-round season would dump 5 unrelated entries into "My Lineup" instead
  // of one coherent lineup. Now called exactly once, when a full season
  // actually completes, saving the whole roster together.
  try{
    const totalFP = seasonRoster.reduce((s,r) => s + r.fp, 0);
    // Historical Run Analysis: maxPossibleFP falls back to r.fp for any
    // round missing it — covers seasons completed before this feature
    // existed, so old saved lineups render as "100% efficient" rather than
    // crashing or showing a misleading gap the game never actually tracked.
    const totalMaxPossibleFP = seasonRoster.reduce((s,r) => s + (r.maxPossibleFP ?? r.fp), 0);
    // Board Ceiling: same fallback pattern — old entries without this
    // field just show no ceiling comparison rather than a fabricated one.
    const totalBoardCeilingFP = seasonRoster.reduce((s,r) => s + (r.boardCeilingFP ?? r.fp), 0);
    const sportPool = getPoolForSport(sport);
    const entry = {
      players: seasonRoster.map(r => {
        const p = sportPool.find(x => x.player === r.player);
        return { player: r.player, fp: r.fp, round: r.round, pos: r.pos || null, tier: p ? p.tier : 'VALUE', accolade: getAccolade(r.player), maxPossibleFP: r.maxPossibleFP ?? r.fp, boardCeilingFP: r.boardCeilingFP ?? r.fp };
      }),
      totalFP: Math.round(totalFP * 10) / 10,
      totalMaxPossibleFP: Math.round(totalMaxPossibleFP * 10) / 10,
      totalBoardCeilingFP: Math.round(totalBoardCeilingFP * 10) / 10,
      date: new Date().toISOString(),
    };
    let seasons = getSavedSeasons(sport);
    seasons.push(entry);
    // Keep only the best MAX_SAVED_SEASONS ever — a new season knocks out
    // the weakest one if the list is already full.
    seasons = seasons.sort((a, b) => b.totalFP - a.totalFP).slice(0, MAX_SAVED_SEASONS);
    localStorage.setItem(lineupStorageKey(sport), JSON.stringify(seasons));
    // Same entry object, written to both lists — Best Lineups (rank-capped,
    // evicts weakest) and History (age-capped, evicts oldest) are two
    // different views over the same underlying results, not two separate
    // sources of truth that could drift apart.
    appendToHistory(entry, sport);
  } catch(e){ /* localStorage unavailable (private browsing, etc.) — silently skip */ }
}

function getBestSeasons(sport){
  return getSavedSeasons(sport).slice().sort((a, b) => b.totalFP - a.totalFP);
}

/* ---------------------------------------------------------------
   BIG-WIN CELEBRATION — fires only for the player's own outcome
   (their held case value, or a big deal they accepted), never for
   just any high-value case that happens to appear on the board.
------------------------------------------------------------------*/
const BIG_WIN_THRESHOLD = 40; // NBA default — celebrates any case at or above 40 FP,
// covering all of ELITE tier (50+) plus the top portion of STAR tier (38-50), not
// just the rarest tier alone. Previously tied exactly to the ELITE floor (50);
// lowered per direct request so strong-but-not-quite-Elite reveals get the same
// celebration treatment.

// FIX: this constant wasn't sport-aware either — NHL's entire real FP pool tops
// out at 17.4 (Nathan MacKinnon), so a threshold of 40 could never fire for a
// single NHL case reveal, silently disabling the celebration for every NHL game.
// Same proportional logic as NBA's 40 (a bit above the STAR floor, short of
// ELITE) applied to NHL's own scale: STAR floor 13.2, ELITE floor 16.5.
function getBigWinThreshold(sport){
  return (sport || 'NBA').toUpperCase() === 'NHL' ? 14 : BIG_WIN_THRESHOLD;
}

function findClosestPlayerByValue(cases, dealValue){
  // "Rounds down" to the highest case value that's <= the deal amount,
  // so a $457,000 offer maps to whichever player sits at $450,000 on
  // this board — never a player worth more than the actual deal.
  const sorted = [...cases].sort((a, b) => a.value - b.value);
  let match = sorted[0];
  for(const c of sorted){
    if(c.value <= dealValue) match = c;
    else break;
  }
  return match;
}

function celebrateIfBig(value, threshold){
  if(value < (threshold ?? BIG_WIN_THRESHOLD)) return;
  if(typeof confetti !== 'function') return;
  const colors = ['#3fb8a8', '#6fe0cf', '#e8f1f8'];

  // Opening burst — bigger and longer-lived (higher ticks) than before,
  // so this alone already reads as a real moment rather than a quick pop.
  confetti({ particleCount: 170, spread: 90, origin: { y: 0.3 }, colors, scalar: 1.15, ticks: 320 });

  // Side cannons shortly after — fire from both edges toward center for
  // an enveloping, surround feel instead of everything coming from one
  // point in the middle of the screen.
  setTimeout(() => {
    confetti({ particleCount: 70, angle: 60, spread: 65, origin: { x: 0, y: 0.55 }, colors, scalar: 1.05, ticks: 300 });
    confetti({ particleCount: 70, angle: 120, spread: 65, origin: { x: 1, y: 0.55 }, colors, scalar: 1.05, ticks: 300 });
  }, 220);

  // Three tapering follow-up waves stretch the whole sequence to roughly
  // 2.5 seconds, each a little smaller than the last, so it settles
  // naturally instead of cutting off abruptly.
  setTimeout(() => confetti({ particleCount: 100, spread: 105, origin: { y: 0.4 }, colors, scalar: 1.0, ticks: 300 }), 550);
  setTimeout(() => confetti({ particleCount: 75, spread: 120, origin: { y: 0.35 }, colors, scalar: 0.9, ticks: 280 }), 1000);
  setTimeout(() => confetti({ particleCount: 55, spread: 90, origin: { y: 0.5 }, colors, scalar: 0.85, ticks: 260 }), 1550);
}

------------------------------------------------------------------*/
const SOUNDS = {
  caseClick: new Audio('sounds/case-click.mp3'),
  bankerRing: new Audio('sounds/banker-ring.mp3'),
  revealSting: new Audio('sounds/reveal-sting.mp3'),
