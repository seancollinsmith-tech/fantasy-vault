function playSound(name){
  if(!state.soundEnabled) return null;
  const base = SOUNDS[name];
  if(!base) return null;
  try{
    // Clone so rapid repeat plays (e.g. quick case clicks) don't cut each other off.
    const instance = base.cloneNode();
    instance.volume = 0.6;
    instance.play().catch(() => { /* file missing or autoplay blocked — ignore */ });
    return instance;
  } catch(e){ return null; }
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildCasesFromBoard(board){
  const shuffled = shuffle(board);
  return shuffled.map((c,i)=>({
    num: i+1,
    value: c.value,
    cost: c.cost,
    player: c.player,
    team: c.team,
    pos: c.pos,
    opened: false,
  }));
}

/* ---------------------------------------------------------------
   RESULT IMAGE GENERATOR — draws a branded, shareable result card
   sized for Instagram/TikTok (1080x1920 vertical) using Canvas.
------------------------------------------------------------------*/
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function drawSpacedText(ctx, text, cx, y, spacing){
  // Manual letter-spacing fallback for broad canvas support.
  const chars = text.split('');
  let totalWidth = 0;
  chars.forEach(c => { totalWidth += ctx.measureText(c).width + spacing; });
  totalWidth -= spacing;
  let x = cx - totalWidth/2;
  const prevAlign = ctx.textAlign;
  ctx.textAlign = 'left';
  chars.forEach(c => {
    ctx.fillText(c, x, y);
    x += ctx.measureText(c).width + spacing;
  });
  ctx.textAlign = prevAlign;
}

function fitCanvasText(ctx, text, maxWidth){
  // Canvas never auto-wraps or ellipsizes — without this, a long player
  // name in the season-lineup image (see generateResultImage's 'season'
  // mode) could run straight into the FP value on the right instead of
  // stopping cleanly.
  if(ctx.measureText(text).width <= maxWidth) return text;
  let t = text;
  while(t.length > 1 && ctx.measureText(t + '…').width > maxWidth){
    t = t.slice(0, -1);
  }
  return t + '…';
}

function drawResultCard(ctx, {x, y, w, h, tag, tagColor, value, valueColor, player}){
  ctx.save();
  ctx.shadowColor = 'rgba(111,224,207,0.25)';
  ctx.shadowBlur = 40;
  const grad = ctx.createLinearGradient(x, y, x+w, y+h);
  grad.addColorStop(0, '#182338');
  grad.addColorStop(1, '#0a0e14');
  ctx.fillStyle = grad;
  roundRect(ctx, x, y, w, h, 22);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = tagColor;
  ctx.lineWidth = 3;
  roundRect(ctx, x, y, w, h, 22);
  ctx.stroke();

  const cx = x + w/2;
  ctx.textAlign = 'center';
  ctx.fillStyle = tagColor;
  ctx.font = '600 26px Oswald, sans-serif';
  drawSpacedText(ctx, tag.toUpperCase(), cx, y + 66, 3);

  ctx.fillStyle = valueColor;
  ctx.font = '700 92px Oswald, sans-serif';
  ctx.fillText(value, cx, y + h*0.58);

  ctx.fillStyle = '#e8f1f8';
  ctx.font = 'italic 600 36px Fraunces, serif';
  ctx.fillText(player, cx, y + h - 40);
}

      grad.addColorStop(0, '#182338');

  ctx.fillText(PRODUCTION_URL.replace(/^https?:\/\//, ''), W/2, 1820);

  return canvas;
}

function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function shareOrCopy(text, imagePayload, btnEl){
  // FIX: Share and Copy used to be two separate buttons in three different
  // places, with Share silently vanishing (display:none, no message)
  // whenever navigator.share wasn't available — common on desktop browsers
  // and in many sandboxed preview contexts. Users were left with no
  // explanation and an easy-to-miss second button as the only way out.
  // One button now always tries the best available method in order and
  // clearly reports what actually happened, so there's never a dead end.
  const originalLabel = btnEl.textContent;
  const showResult = (label) => {
    btnEl.textContent = label;
    setTimeout(() => { btnEl.textContent = originalLabel; }, 2200);
  };

  // 1. Native share with an image attached, if the platform supports it.
  if(imagePayload && navigator.share && navigator.canShare){
    try{
      const canvas = await generateResultImage(imagePayload);
      const blob = await canvasToBlob(canvas);
      const file = new File([blob], 'fantasy-vault-result.png', { type: 'image/png' });
      if(navigator.canShare({ files: [file] })){
        await navigator.share({ files: [file], text });
        return;
      }
    } catch(err){
      if(err && err.name === 'AbortError') return; // user closed the share sheet on purpose
      // image path failed — fall through and try text-only share next
    }
  }

  // 2. Native text-only share.
  if(navigator.share){
    try{
      await navigator.share({ text });
      return;
    } catch(err){
      if(err && err.name === 'AbortError') return;
      // fall through to copy
    }
  }

  // 3. Clipboard copy — the most broadly-supported fallback.
  try{
    if(!navigator.clipboard || !navigator.clipboard.writeText){
      throw new Error('Clipboard API unavailable');
    }
    await navigator.clipboard.writeText(text);
    showResult('Copied to clipboard!');
    return;
  } catch(e){
    // 4. Legacy execCommand copy, for older/restrictive browsers where the
    // async Clipboard API is blocked but this older path still works.
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      showResult(ok ? 'Copied to clipboard!' : 'Could not share or copy');
    } catch(e2){
      showResult('Could not share or copy');
    }
  }
}

function renderOnboarding(){

  const inner = document.getElementById('onboardingOverlayInner');
  const step = ONBOARDING_STEPS[onboardingStepIndex];
  const isFirst = onboardingStepIndex === 0;
  const isLast = onboardingStepIndex === ONBOARDING_STEPS.length - 1;
  const dots = ONBOARDING_STEPS.map((_, i) => `<span class="onboarding-dot${i === onboardingStepIndex ? ' active' : ''}"></span>`).join('');

  inner.innerHTML = `
    <div class="onboarding-card">
      <p class="finale-eyebrow">How To Play · ${onboardingStepIndex + 1} of ${ONBOARDING_STEPS.length}</p>

      <div class="onboarding-dots">${dots}</div>

        ${isFirst ? `<button id="onboardingSkipBtn">Skip</button>` : `<button id="onboardingBackBtn">Back</button>`}
        <button class="primary" id="onboardingNextBtn">${isLast ? "Let's Play" : 'Next'}</button>

    if(filled){
      const p = getPoolForSport(state.currentSport).find(x => x.player === filled.player);
      const tier = p ? p.tier : 'VALUE';
      const color = getTierColorByName(tier, state.currentSport);
      dots.push(`<div class="vault-slot filled">
        <span class="vault-dot" style="background:${color};border-color:${color};"></span>
        <span class="vault-slot-label">${slotTag}<strong>${filled.player}</strong> ${fmt(filled.fp)}</span>
      </div>`);
    } else {
      const isCurrent = i === season.roundNumber;
      dots.push(`<div class="vault-slot${isCurrent ? ' current' : ''}">
        <span class="vault-dot"></span>
        <span class="vault-slot-label">${slotTag} ${isCurrent ? 'In progress' : `Round ${i}`}</span>
      </div>`);
    }
  }
  el.innerHTML = `<div class="vault-progress">${dots.join('')}</div>`;
}

function getActionLabel(){
  switch(state.phase){
    case 'pick': return 'PICK YOUR CASE';
    case 'playing': {
      const toOpen = Math.max(0, ROUND_SCHEDULE[state.roundIndex] - state.casesOpenedThisRound);
      return `OPEN ${toOpen} CASE${toOpen===1?'':'S'}`;
    }
    case 'ringing': return 'THE BANKER IS CALLING';
    case 'offer': return 'DEAL OR NO DEAL?';
    case 'final': return 'FINAL TWO';
    case 'dealt': return 'DEAL MADE';
    default: return '';
  }
}

function renderBoard(){
  const el = document.getElementById('board');
  const gameArea = document.getElementById('gameArea');
  if(state.phase === 'setup' || state.phase === 'lineup'){ el.innerHTML=''; gameArea.style.display='none'; return; }
  gameArea.style.display='flex';

  el.innerHTML = '';
  state.cases.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'case-btn';
    if(c.num === state.heldCaseNum) btn.classList.add('held');
    if(c.opened) btn.classList.add('opened');

    const canPick = state.phase === 'pick' && !c.opened;
    const canOpen = state.phase === 'playing' && !c.opened && c.num !== state.heldCaseNum;
    btn.disabled = !(canPick || canOpen);

    if(c.opened){
      btn.style.borderColor = getRarityTier(c.value).color;
      btn.innerHTML = `${teamBadgeHtml(c.team)}<span class="case-player">${c.player}</span><span class="case-value" style="color:${getRarityTier(c.value).color};">${fmt(c.value)}</span>`;
    } else {
      btn.innerHTML = `<span class="case-num">Case</span><span class="case-lock">${c.num}</span>`;
    }
    btn.onclick = () => {
      if(canPick) pickCase(c.num);
      else if(canOpen) openCase(c.num);
    };
    el.appendChild(btn);
  });
}

function renderLadder(){
  const el = document.getElementById('ladder');
  if(state.phase === 'setup' || state.cases.length === 0){ el.innerHTML=''; return; }

  const heldCase = state.cases.find(c=>c.num===state.heldCaseNum);
  const heldValue = heldCase ? heldCase.value : null;

  const sortedValues = state.cases
    .map(c=>({ value:c.value, opened:c.opened, isHeld: c.num===state.heldCaseNum }))
    .sort((a,b)=>a.value-b.value);

  const n = sortedValues.length;
  const half = Math.ceil(n/2);
  const leftCol = sortedValues.slice(0, half);
  const rightCol = sortedValues.slice(half);

  // Item 2: tier-based emphasis on still-live values — muted for low values,
  // subtle teal for the top tier, so the ladder itself reads as a value
  // gradient at a glance instead of flat white text.
  const rowHtml = (entry, idx, colLen) => {
    const rankFromTop = n - (sortedValues.indexOf(entry));
    const isTopTier = rankFromTop <= Math.ceil(n * 0.2); // top ~20% of the board
    const liveColor = entry.opened ? '' : (isTopTier ? 'color:var(--brass-bright);' : 'color:var(--cream-dim);');
    return `
    <div class="ladder-row${entry.opened ? ' struck' : ''}${entry.isHeld && state.heldRevealed ? ' held-value' : ''}" style="${liveColor}">
      <span class="lv-value">${fmt(entry.value)}</span>
    </div>`;
  };

  el.innerHTML = `
    <p class="ladder-title">Vault Values</p>
    <div class="ladder-cols">
      <div class="ladder-col">${leftCol.map((e,i)=>rowHtml(e,i,leftCol.length)).join('')}</div>
      <div class="ladder-col">${rightCol.map((e,i)=>rowHtml(e,i,rightCol.length)).join('')}</div>
    </div>
  `;
}

          <p class="hero-tag">Case #${lastOpen.num} — the one you passed on</p>
          ${rarityBadgeHtml(lastOpen.value)} ${teamBadgeHtml(lastOpen.team)}
          <p class="hero-value">${fmt(lastOpen.value)}</p>
          <p class="hero-player">${lastOpen.player}</p>
          ${getAccolade(lastOpen.player) ? `<p class="hero-accolade">${getAccolade(lastOpen.player)}</p>` : ''}
        </div>
      </div>
      <div class="panel-actions" style="justify-content:center;">
        <button class="primary" id="playAgainBtn2">${season.roster.length+1 >= getSeasonRounds(state.currentSport) ? 'See Your Lineup' : `Continue to Round ${season.roundNumber+1}`}</button>
        ${state.declinedOffers.length ? '<button id="viewHistoryBtn2">View offer history</button>' : ''}
        <button id="shareResultBtn2">Share</button>
      </div>
      ${state.declinedOffers.length ? `
        <div class="finale-history hidden" id="finaleHistory2">
          <h4>Offers you passed on</h4>
          <ul class="history-list">${historyRows}</ul>
        </div>
      ` : ''}
    `;
    overlay.classList.remove('hidden');
    document.getElementById('playAgainBtn2').onclick = () => {
      advanceSeasonRound(held.player, held.value, held.pos);
    };
    if(state.declinedOffers.length){
      document.getElementById('viewHistoryBtn2').onclick = (e) => {
        const hist = document.getElementById('finaleHistory2');
        hist.classList.toggle('hidden');
        e.target.textContent = hist.classList.contains('hidden') ? 'View offer history' : 'Hide offer history';
      };
    }
    document.getElementById('shareResultBtn2').onclick = (e) => shareOrCopy(shareText, imagePayload, e.target);
  };
}

function renderLineupCard(entry, i, mode){
  const dateLabel = new Date(entry.date).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  // Historical Run Analysis, retroactive view — totalMaxPossibleFP falls
  // back to totalFP for entries saved before this feature existed, same
  // fallback logic as saveSeasonToLineup, so old cards show 100% rather
  // than a misleading gap the game never actually recorded.
  const maxPossible = entry.totalMaxPossibleFP ?? entry.totalFP;
  const efficiencyPct = maxPossible > 0 ? Math.round((entry.totalFP / maxPossible) * 100) : 100;
  const boardCeiling = entry.totalBoardCeilingFP ?? entry.totalFP;
  const capturedPct = boardCeiling > 0 ? Math.round((entry.totalFP / boardCeiling) * 100) : 100;
  const playerRows = entry.players.map(p => {
    const roundMax = p.maxPossibleFP ?? p.fp;
    const roundGap = Math.round((roundMax - p.fp) * 10) / 10;
    const gapTag = roundGap > 0.05 ? `<span class="round-gap-tag">left ${fmt(roundGap)} on the table</span>` : '';
    return `
    <div class="lineup-mini-row">
      <span class="round-tag">R${p.round}</span>
      <span class="lineup-mini-player" style="color:${getRarityTier(p.fp).color};">${p.player}</span>
      <span class="lineup-mini-fp">${fmt(p.fp)}${gapTag}</span>
    </div>
  `;
  }).join('');
  // Best Lineups is ranked by strength, so a "#1/#2/..." badge means
  // something there. History is chronological, not ranked — showing a
  // "#1" on the most recent entry would look like a strength ranking it
  // isn't, so History cards lead with the date instead and drop the badge.
  const headerLeft = mode === 'best' ? `<p class="lineup-rank">#${i+1}</p>` : '';
  return `
    <div class="lineup-card season-card">
      <div class="lineup-card-header">
        ${headerLeft}
        <p class="lineup-total-value">${fmt(entry.totalFP)}</p>
        <p class="lineup-date">${dateLabel}</p>
      </div>
      <p class="card-efficiency-line">Board ceiling captured: <strong>${capturedPct}%</strong>${capturedPct < 100 ? ` <span class="card-efficiency-detail">(ceiling: ${fmt(boardCeiling)})</span>` : ''} · Decision efficiency: <strong>${efficiencyPct}%</strong>${efficiencyPct < 100 ? ` <span class="card-efficiency-detail">(max possible: ${fmt(maxPossible)})</span>` : ' — optimal'}</p>
      <div class="lineup-mini-list">${playerRows}</div>
      <div class="panel-actions" style="margin-top:12px;">
        <button class="share-lineup-btn" data-entry-idx="${i}">Share</button>
      </div>
    </div>
  `;
}

function renderLineupPanel(){
  const el = document.getElementById('finalPanel');
  if(state.phase !== 'lineup') return; // don't clear finalPanel here — renderFinalPanel already owns that for other phases
  const sport = state.currentSport;
  const mode = lineupViewMode === 'history' ? 'history' : 'best';
  const entries = mode === 'best' ? getBestSeasons(sport) : getLineupHistory(sport);

  const tabsHtml = `
    <div class="lineup-tabs">
      <button class="lineup-tab-btn${mode==='best' ? ' active' : ''}" id="lineupTabBest">Best Lineups</button>
      <button class="lineup-tab-btn${mode==='history' ? ' active' : ''}" id="lineupTabHistory">History</button>
    </div>
  `;

  if(!entries.length){
    const dailyEligible = DAILY_ELIGIBLE_SPORTS.includes((sport || 'NBA').toUpperCase());
    const emptyMsg = !dailyEligible
      // Best Lineups/History are Daily-only (Free Play never feeds them —
      // see the populated-state copy below), and Daily Challenge is
      // NBA-only, so for any other sport this panel can never receive a
      // real entry through legitimate play. Telling an NHL player to "go
      // complete a Daily Challenge" here would be a genuinely impossible
      // instruction, not just a rounding-off default — say so plainly
      // instead of implying it's just waiting for them to go play.
      ? `Best Lineups and History are tied to Daily Challenge, which is NBA-only right now — so there's nothing to show for ${sport} yet, and Free Play here won't fill it either. Once Daily Challenge adds ${sport}, completed runs will start saving here automatically.`
      : mode === 'best'
        ? `No lineups saved yet — complete a Daily Challenge (all ${getSeasonRounds(sport)} rounds) and your full lineup automatically gets added here. Your best ${MAX_SAVED_SEASONS} Daily Challenge lineups ever stay saved. Free play doesn't count toward this.`
        : `No history yet — every completed Daily Challenge gets logged here automatically, win or lose, up to your last ${MAX_HISTORY_ENTRIES} days. This is separate from Best Lineups above: nothing gets bumped out just because a stronger lineup comes along later. Free play doesn't count toward this either.`;
    el.innerHTML = `
      <div class="panel">
        <h2>My ${sport} Lineup</h2>
        ${tabsHtml}
        <p>${emptyMsg}</p>
        <div class="panel-actions">
          <button class="primary" id="backFromLineupBtn">Back</button>
        </div>
      </div>
    `;
    document.getElementById('backFromLineupBtn').onclick = () => { state.phase = 'setup'; render(); };
    wireLineupTabButtons();
    return;
  }

  const entryCardsHtml = entries.map((entry, i) => renderLineupCard(entry, i, mode)).join('');

  const descriptionHtml = mode === 'best'
    ? `<p>Your best ${entries.length} of up to ${MAX_SAVED_SEASONS} Daily Challenge lineups ever — each row is one complete ${getSeasonRounds(sport)}-round result. A new lineup bumps out the weakest one automatically. Free play doesn't count toward this.</p>`
    : `<p>Every completed Daily Challenge, most recent first — ${entries.length} of up to ${MAX_HISTORY_ENTRIES} days. Nothing gets bumped out for scoring low; only your oldest entries roll off once the cap is hit. Free play doesn't count toward this.</p>`;

  const clearBtnHtml = mode === 'best'
    ? `<button class="ghost-ember" id="clearLineupBtn">Clear my lineup</button>`
    : `<button class="ghost-ember" id="clearHistoryBtn">Clear history</button>`;

  el.innerHTML = `
    <div class="panel">
      <h2>My ${sport} Lineup</h2>
      ${tabsHtml}
      ${descriptionHtml}
      <div class="lineup-grid">${entryCardsHtml}</div>
      <div class="panel-actions">
        <button class="primary" id="backFromLineupBtn">Back</button>
        ${clearBtnHtml}
      </div>
    </div>
  `;
  document.getElementById('backFromLineupBtn').onclick = () => { state.phase = 'setup'; render(); };
  const clearBestBtn = document.getElementById('clearLineupBtn');
  if(clearBestBtn) clearBestBtn.onclick = () => {
    try{ localStorage.removeItem(lineupStorageKey(sport)); } catch(e){}
    render();
  };
  const clearHistoryBtn = document.getElementById('clearHistoryBtn');
  if(clearHistoryBtn) clearHistoryBtn.onclick = () => {
    try{ localStorage.removeItem(historyStorageKey(sport)); } catch(e){}
    render();
  };
  document.querySelectorAll('.share-lineup-btn').forEach(btn => {
    btn.onclick = (e) => {
      const s = entries[Number(e.target.dataset.entryIdx)];
      const shareText = buildShareText({
        resultLine: `I built a ${fmt(s.totalFP)} lineup in Fantasy Vault!`,
        passedLine: s.players.map(p => p.player).join(' · ')
      });
      const imagePayload = {
        mode: 'season',
        totalFP: fmt(s.totalFP),
        players: s.players.map(p => ({ player: p.player, round: p.round, pos: p.pos || null, fp: fmt(p.fp) })),
      };
      shareOrCopy(shareText, imagePayload, e.target);
    };
  });
  wireLineupTabButtons();
}

function wireLineupTabButtons(){
  const bestTab = document.getElementById('lineupTabBest');
  const historyTab = document.getElementById('lineupTabHistory');
  if(bestTab) bestTab.onclick = () => { lineupViewMode = 'best'; render(); };
  if(historyTab) historyTab.onclick = () => { lineupViewMode = 'history'; render(); };
}

/* ---------------------------------------------------------------
   GAME LOGIC
------------------------------------------------------------------*/
function startGame(board){
  if(!board || board.length < 3){ return; }
  state.cases = buildCasesFromBoard(board);
  state.heldCaseNum = null;
  state.roundIndex = 0;
  state.casesOpenedThisRound = 0;
  state.currentOffer = 0;
  state.dealAcceptedValue = null;
  state.heldRevealed = false;
  state.declinedOffers = [];
  state.pendingOfferCases = null;
  state.lastOpenedCase = null;
  // FIX: this used to unconditionally set isDailyMode = false here. That
  // was correct for the very first round of a session but wrong for every
  // round after it — advanceSeasonRound() calls startGame() again to deal
  // each new round's board, INCLUDING within an already-running Daily
  // Challenge, so this was silently flipping a Daily session back to
  // "not daily" the moment round 2 started. Net effect: markDailyCompleted/
  // saveSeasonToLineup never actually fired at real completion (isDailyMode
  // was already false by then), so Daily results past round 1 were never
  // being saved or counted toward the streak. isDailyMode is now set
  // explicitly by the two real entry points instead: startNewSeason() sets
  // it false, startDailyChallenge() sets it true, both BEFORE calling
  // startGame() — so it's correct from the first render and stays correct
  // across every subsequent round-to-round call from advanceSeasonRound().
  state.phase = 'pick';
  render();
  logPlay();
}

async function logPlay(){
  // STUBBED FOR FANTASY VAULT — no separate backend connected yet; this
  // would otherwise log sessions into the REAL Vault's production counter.
}

async function loadPlayCount(){
  const line = document.getElementById('playCountLine');
  if(!line) return;
  line.textContent = 'Play count needs a separate Fantasy Vault backend — not connected yet.';
}

function pickCase(num){
  state.heldCaseNum = num;
  state.phase = 'playing';
  render();
}

function openCase(num){
  const c = state.cases.find(x=>x.num===num);
  if(!c || c.opened) return;
  c.opened = true;
  playSound('caseClick');
  state.lastOpenedCase = { player: c.player, value: c.value };
  state.casesOpenedThisRound++;

  const remainingUnopened = state.cases.filter(x=>!x.opened && x.num!==state.heldCaseNum);

  // FIX: this used to only check "down to the final case?" AFTER hitting the
  // schedule's segment target — fine on a fixed 26-card board where the
  // schedule and board size are always in sync, but a genuinely thin/organic
  // board (see buildTonightBoard) could run OUT of clickable cases before
  // ever reaching that target, leaving the game stuck with nothing to click
  // and no offer ever triggered. Check for running out first, unconditionally.
  if(remainingUnopened.length <= 1){
    state.phase = 'final';
    render();
    scrollToFinalReveal();
    return;
  }

  // Round complete?
  if(state.casesOpenedThisRound >= ROUND_SCHEDULE[state.roundIndex]){
    triggerRing(remainingUnopened);
    return;
  }

  render();
}

function triggerRing(remainingUnopened){
  state.pendingOfferCases = remainingUnopened;
  state.bankerLine = computeBankerLine();
  state.phase = 'ringing';
  render();
  const ringAudio = playSound('bankerRing');
  setTimeout(()=>{
    // Cut the ring sound off cleanly here even if the audio file itself runs
    // longer than the on-screen ring animation — keeps sound and UI in sync
    // regardless of how long the specific sound file happens to be.
    if(ringAudio){ try{ ringAudio.pause(); }catch(e){} }
    if(state.phase !== 'ringing') return; // player navigated away mid-ring
    state.currentOffer = computeOffer(state.pendingOfferCases);
    state.phase = 'offer';
    render();
  }, 2200);
}

const RISK_DISCOUNT = 0.35; // tuned empirically — see chat. How hard the banker
// hedges while the board's real "big" cards are still unaccounted for.

function computeOffer(remainingUnopened){
  const avg = remainingUnopened.reduce((s,c)=>s+c.value,0) / remainingUnopened.length;
  const mult = ROUND_MULTIPLIER[Math.min(state.roundIndex, ROUND_MULTIPLIER.length-1)];

  // Rarity-aware risk adjustment. The old formula only ever looked at the
  // AVERAGE of remaining cards — but sampleBoard() deliberately guarantees
  // every 26-card board a handful of real STAR/ELITE outliers (so reveals
  // feel exciting), which means a held case has a far higher chance of
  // being one of those than the raw player pool's rarity would suggest
  // (measured: ~18% STAR / ~5% ELITE per held case on an actual generated
  // board, vs ~6.5% / ~0.9% in the full 567-player pool). A flat average
  // can't see that risk at all, because the held case is deliberately
  // excluded from its own calculation — so no multiplier curve, however
  // aggressive, can make the offer catch up (verified empirically: even
  // an extreme 1.55x multiplier only won ~50% of the time).
  // This instead tracks what a real banker actually has visibility into:
  // how many of THIS board's real big cards (STAR-or-better) are still
  // unaccounted for — meaning still unopened, or possibly the held case
  // itself, which is exactly the genuine uncertainty a banker can't see
  // through any more than the player can. As big cards get opened and
  // provably eliminated, that uncertainty shrinks and the offer can
  // afford to get more confident — the same shape real Deal-or-No-Deal
  // offers follow, and unlike the old formula, the exact trajectory now
  // depends on the actual (random) order big cards get revealed each
  // round, not a fixed schedule.
  const sport = state.currentSport;
  const bigCards = state.cases.filter(c => {
    const tier = getRarityTier(c.value, sport).name;
    return tier === 'STAR' || tier === 'ELITE';
  });
  const bigCardsUnaccounted = bigCards.filter(c => !c.opened).length;
  const riskFactor = bigCards.length > 0 ? bigCardsUnaccounted / bigCards.length : 0;
  const riskAdjustedMult = mult * (1 - riskFactor * RISK_DISCOUNT);

  const raw = Math.round(avg * riskAdjustedMult); // nearest whole FP
  // FIX: with no floor, a tightly-clustered remaining set (little real
  // uncertainty left) combined with a sub-1.0 multiplier could produce an
  // offer BELOW every possible remaining case — making No Deal a completely
  // risk-free dominant choice with zero incentive to ever take the deal.
  // The offer can never go below the worst-case guaranteed outcome.
  const minRemaining = Math.min(...remainingUnopened.map(c => c.value));
  return Math.max(raw, Math.ceil(minRemaining));
}

function takeDeal(){
  state.dealAcceptedValue = state.currentOffer;
  const boardAvg = state.cases.reduce((s,c)=>s+c.value,0) / state.cases.length;
  state.bankerReactionLine = pickBankerLine(state.dealAcceptedValue >= boardAvg ? 'acceptedStrong' : 'acceptedWeak');
  state.phase = 'dealt';
  render();
  openDealOverlay();
  celebrateIfBig(state.dealAcceptedValue, getBigWinThreshold(state.currentSport));
}

function openDealOverlay(){
  const held = state.cases.find(c=>c.num===state.heldCaseNum);
  const overlay = document.getElementById('finaleOverlay');
  const inner = document.getElementById('finaleOverlayInner');
  const closest = findClosestPlayerByValue(state.cases, state.dealAcceptedValue);
  const dealtShareText = buildShareText({
    resultLine: `I took the deal in Fantasy Vault and locked in ${fmt(state.dealAcceptedValue)}!`,
    passedLine: closest ? `That's about ${closest.player} money (${fmt(closest.value)}).` : ''
  });
  const historyRows = state.declinedOffers.map(d =>
    `<li><span class="round-tag">Offer ${d.round}</span> <strong>${fmt(d.offer)}</strong></li>`
  ).join('');
  const imagePayload = {
    mode: 'deal',
    dealAmount: fmt(state.dealAcceptedValue),
    caseLabel: closest ? `That's ${closest.player} money` : `Case #${held.num} stays sealed`,
    revealedPlayer: null, revealedValue: null
  };

  inner.innerHTML = `
    <p class="finale-eyebrow">Fantasy Vault</p>
    <p class="finale-title">DEAL!</p>
    <p class="banker-quote" style="text-align:center;">"${state.bankerReactionLine}"</p>
    <div class="hero-reveal-wrap" id="dealHeroWrap">
      <div class="hero-reveal is-yours ${rarityCardStyle(state.dealAcceptedValue).classes}" style="${rarityCardStyle(state.dealAcceptedValue).style}">
        <p class="hero-tag">You banked</p>
        ${rarityBadgeHtml(state.dealAcceptedValue)}
        <p class="hero-value">${fmt(state.dealAcceptedValue)}</p>
        <p class="hero-player">Case #${held.num} stays sealed</p>
        ${closest ? `<p class="deal-equivalent">That's about <strong>${closest.player}</strong> money (${fmt(closest.value)})</p>` : ''}
      </div>
    </div>
    <div class="panel-actions" style="justify-content:center;">
      <button id="revealHeldBtnOverlay">Reveal your case anyway</button>
      ${state.declinedOffers.length ? '<button id="viewHistoryBtnOverlay">View offer history</button>' : ''}
      <button id="shareResultBtnOverlay">Share</button>
      <button class="primary" id="playAgainBtnOverlay">${season.roster.length+1 >= getSeasonRounds(state.currentSport) ? 'See Your Lineup' : `Continue to Round ${season.roundNumber+1}`}</button>
    </div>
    ${state.declinedOffers.length ? `
      <div class="finale-history hidden" id="finaleHistoryOverlay">
        <h4>Offers you passed on</h4>
        <ul class="history-list">${historyRows}</ul>
      </div>
    ` : ''}
  `;
  overlay.classList.remove('hidden');

  document.getElementById('playAgainBtnOverlay').onclick = () => {
    // Deal awards the closest AFFORDABLE match by cost, not the raw offer
    // number — every case this round is already affordable by construction
    // (generateRoundBoard filters to budget before the round even starts),
    // so `closest` is guaranteed to exist here.
    advanceSeasonRound(closest.player, closest.value, closest.pos);
  };
  document.getElementById('shareResultBtnOverlay').onclick = (e) => shareOrCopy(dealtShareText, imagePayload, e.target);
  if(state.declinedOffers.length){
    document.getElementById('viewHistoryBtnOverlay').onclick = (e) => {
      const hist = document.getElementById('finaleHistoryOverlay');
      hist.classList.toggle('hidden');
      e.target.textContent = hist.classList.contains('hidden') ? 'View offer history' : 'Hide offer history';
    };
  }
  document.getElementById('revealHeldBtnOverlay').onclick = (e) => {
    state.heldRevealed = true;
    playSound('revealSting');
    imagePayload.revealedPlayer = held.player;
    imagePayload.revealedValue = fmt(held.value);
    document.getElementById('dealHeroWrap').insertAdjacentHTML('beforeend', `
      <div class="hero-reveal is-passed ${rarityCardStyle(held.value).classes}" style="${rarityCardStyle(held.value).style}">
        <p class="hero-tag">Case #${held.num} — what was inside</p>
        ${rarityBadgeHtml(held.value)} ${teamBadgeHtml(held.team)}
        <p class="hero-value">${fmt(held.value)}</p>
        <p class="hero-player">${held.player}</p>
        ${getAccolade(held.player) ? `<p class="hero-accolade">${getAccolade(held.player)}</p>` : ''}
      </div>
    `);
    e.target.remove();
  };
}

function declineDeal(){
  state.declinedOffers.push({ round: state.roundIndex+1, offer: state.currentOffer });
  state.roundIndex++;
  state.casesOpenedThisRound = 0;
  showBankerToast(pickBankerLine('rejected'));

  const remainingUnopened = state.cases.filter(x=>!x.opened && x.num!==state.heldCaseNum);
  if(state.roundIndex >= ROUND_SCHEDULE.length || remainingUnopened.length <= 1){
    state.phase = 'final';
  } else {
    state.phase = 'playing';
  }
  render();
  if(state.phase === 'final') scrollToFinalReveal();
}

function showBankerToast(line){
  const existing = document.getElementById('bankerToast');
  if(existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'bankerToast';
  toast.className = 'banker-toast';
  toast.textContent = `"${line}"`;
  document.body.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 400);
  }, 1800);
}

/* ---------------------------------------------------------------
   INIT
------------------------------------------------------------------*/
document.getElementById('homeLogo').addEventListener('click', goHome);

// Auto-resume a same-day in-progress Daily Challenge on page load, rather
// than showing the setup screen first and making the player go find a
// "Resume" button — this is the actual fix for the refresh-mid-round
// lockout: reload now drops you back exactly where you left off.
const bootDailyProgress = loadDailyProgress();
if(bootDailyProgress){
  resumeDailyProgress(bootDailyProgress);
} else {
  render();
  // Only offer the walkthrough on a genuinely fresh setup-phase visit —
  // never on top of a resumed session. A first-time visitor can't have
  // both an unseen-onboarding flag AND existing daily progress anyway
  // (the latter requires having already started a session), so this
  // ordering can't actually conflict in practice, but the phase check
  // keeps it correct even if that assumption ever stops holding.
  let onboardingSeen = true;
  try{ onboardingSeen = !!localStorage.getItem(ONBOARDING_SEEN_KEY); }catch(e){}
  if(!onboardingSeen && state.phase === 'setup'){
    openOnboarding();
  }
}
loadPresetIndex();
initAuth();
